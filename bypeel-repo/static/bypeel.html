<!-- ============================= INGEST MODULE (Step 1 · Data Ingestion) ============================= -->
<script>
(function(){
  const TYPE_LABELS = {
    peel_chain:'Peeling Chain', round_amount_offhours:'Round-Amount Off-Hours',
    rapid_fan_out_layering:'Rapid Fan-Out Layering', fan_in_smurfing:'Fan-In Smurfing',
    shared_ip_burst:'Shared-IP Burst', none:'Unclassified Outlier',
  };
  const TYPE_DESC = {
    peel_chain: 'Sequential 1-in/2-out cascade: a small amount is peeled off to a destination while the bulk of value is forwarded to a fresh change address — the classic laundering signature.',
    round_amount_offhours: 'Suspiciously round BTC value moved during low-activity hours, consistent with automated/scripted illicit transfers rather than organic spend behaviour.',
    rapid_fan_out_layering: 'A single input rapidly fans out to many outputs — a layering technique used to fragment funds across many wallets to defeat tracing.',
    fan_in_smurfing: 'Many small inputs converge into one transaction — classic smurfing/structuring pattern used to consolidate proceeds while staying under reporting thresholds.',
    shared_ip_burst: 'Multiple transactions broadcast from the same source IP in a short burst, touching many distinct wallets — indicative of a single operator running several addresses.',
    none: 'Statistically unusual transaction that did not match a known laundering motif but deviates significantly from population norms.',
  };
  const FEATURE_LABELS = {
    src_ip_burst_count:'IP Burst Count', total_input_amount:'Total Input Amount', total_output_amount:'Total Output Amount',
    is_offhours:'Off-Hours Timing', num_inputs:'Input Count (Fan-In)', num_outputs:'Output Count (Fan-Out)',
    fee:'Fee Amount',
  };

  /* ======================= UNION-FIND ======================= */
  function makeUnionFind(){
    const parent = new Map();
    function find(x){
      if(!parent.has(x)) parent.set(x, x);
      let root = x;
      while(parent.get(root) !== root) root = parent.get(root);
      let cur = x;
      while(parent.get(cur) !== root){ const next = parent.get(cur); parent.set(cur, root); cur = next; }
      return root;
    }
    function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent.set(ra, rb); }
    return { find, union, parent };
  }

  /* ======================= STATS HELPERS ======================= */
  function median(arr){
    if(!arr.length) return 0;
    const s = [...arr].sort((a,b)=>a-b);
    const mid = Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }
  function mad(arr, med){
    if(!arr.length) return 0;
    const dev = arr.map(v=>Math.abs(v-med));
    const m = median(dev);
    if(m > 0) return m;
    const meanAbsDev = dev.reduce((a,b)=>a+b,0) / dev.length;
    return meanAbsDev > 0 ? meanAbsDev : Math.max(Math.abs(med) * 0.1, 0.5);
  }
  function robustZ(v, med, madv){
    const z = (v - med) / (1.4826 * (madv || 1e-9));
    return Math.max(-60, Math.min(60, z));
  }
  function quantile(arr, q){
    if(!arr.length) return 0;
    const s = [...arr].sort((a,b)=>a-b);
    const pos = (s.length-1)*q;
    const base = Math.floor(pos), rest = pos-base;
    return s[base+1]!==undefined ? s[base] + rest*(s[base+1]-s[base]) : s[base];
  }
  function round2(v){ return Math.round(v*100)/100; }
  function round6(v){ return Math.round(v*1e6)/1e6; }
  function round8(v){ return Math.round(v*1e8)/1e8; }

  /* ======================= CORE PIPELINE ======================= */
  function runPipeline(rawTx, log){
    log = log || (()=>{});
    const tx = rawTx.slice().sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));

    const uf = makeUnionFind();
    tx.forEach(row=>{
      const ins = row.input_addresses;
      ins.forEach(a=>uf.find(a));
      for(let i=1;i<ins.length;i++) uf.union(ins[0], ins[i]);
      row.output_addresses.forEach(a=>uf.find(a));
    });
    const entMap = new Map();
    function eid(addr){
      const r = uf.find(addr);
      if(!entMap.has(r)) entMap.set(r, `E${(entMap.size+1).toString().padStart(4,'0')}`);
      return entMap.get(r);
    }
    const entMembers = new Map();
    uf.parent.forEach((_, addr)=>{
      const e = eid(addr);
      if(!entMembers.has(e)) entMembers.set(e, new Set());
      entMembers.get(e).add(addr);
    });
    log(`Resolved ${uf.parent.size.toLocaleString()} wallet addresses into ${entMap.size.toLocaleString()} logical entities via Common-Input-Ownership Heuristic.`);

    const ipBurstWindowMs = 15*60*1000;
    const ipTimestamps = new Map();
    tx.forEach(row=>{
      const ms = new Date(row.timestamp).getTime();
      if(!ipTimestamps.has(row.src_ip)) ipTimestamps.set(row.src_ip, []);
      ipTimestamps.get(row.src_ip).push(ms);
    });
    const ipWalletTouch = new Map();
    tx.forEach(row=>{
      if(!ipWalletTouch.has(row.src_ip)) ipWalletTouch.set(row.src_ip, new Set());
      const s = ipWalletTouch.get(row.src_ip);
      row.input_addresses.forEach(a=>s.add(a));
      row.output_addresses.forEach(a=>s.add(a));
    });

    tx.forEach(row=>{
      const ms = new Date(row.timestamp).getTime();
      row._ms = ms;
      row._totalIn = row.input_amounts.reduce((a,b)=>a+b,0);
      row._totalOut = row.output_amounts.reduce((a,b)=>a+b,0);
      row._nIn = row.input_addresses.length;
      row._nOut = row.output_addresses.length;
      const hr = new Date(row.timestamp).getUTCHours();
      row._offhours = (hr < 6 || hr >= 22) ? 1 : 0;
      const list = ipTimestamps.get(row.src_ip) || [];
      row._ipBurst = list.filter(t => Math.abs(t-ms) <= ipBurstWindowMs).length;
      row._ipWalletDiversity = (ipWalletTouch.get(row.src_ip) || new Set()).size;
      const outsSorted = row.output_amounts.slice().sort((a,b)=>b-a);
      row._outAsymmetry = outsSorted.length>=2 && outsSorted[outsSorted.length-1] > 0
        ? outsSorted[0] / outsSorted[outsSorted.length-1] : (outsSorted.length===1?1:0);
    });

    const feats = ['_totalIn','_totalOut','_nIn','_nOut','_ipBurst','fee'];
    const stats = {};
    feats.forEach(f=>{
      const vals = tx.map(r=> f==='fee' ? r.fee : r[f]);
      const med = median(vals), md = mad(vals, med);
      stats[f] = {med, md};
    });
    log(`Computed population baselines (median/MAD) across ${feats.length} core features for robust z-scoring.`);

    const FAN_OUT_THRESH = Math.max(8, stats._nOut.med + 6*Math.max(1,stats._nOut.md));
    const FAN_IN_THRESH  = Math.max(8, stats._nIn.med + 6*Math.max(1,stats._nIn.md));
    const totalInQ995 = quantile(tx.map(r=>r._totalIn), 0.995);
    const burstQ995 = quantile(tx.map(r=>r._ipBurst), 0.995);
    const IP_BURST_THRESH = Math.max(4, Math.ceil(burstQ995));

    tx.forEach(row=>{
      let type = 'none';
      if(row._nIn===1 && row._nOut===2 && row._totalIn >= totalInQ995 && row._outAsymmetry >= 2){
        type = 'peel_chain';
      } else if(row._nOut >= FAN_OUT_THRESH){
        type = 'rapid_fan_out_layering';
      } else if(row._nIn >= FAN_IN_THRESH){
        type = 'fan_in_smurfing';
      } else if(row._offhours && row._totalOut >= 1 && (Math.abs(row._totalOut - Math.round(row._totalOut)) < 0.02)){
        type = 'round_amount_offhours';
      } else if(row._ipBurst > IP_BURST_THRESH){
        type = 'shared_ip_burst';
      }
      row._motif = type;

      const zIn = robustZ(row._totalIn, stats._totalIn.med, stats._totalIn.md);
      const zOut = robustZ(row._totalOut, stats._totalOut.med, stats._totalOut.md);
      const zBurst = robustZ(row._ipBurst, stats._ipBurst.med, stats._ipBurst.md);
      const zNIn = robustZ(row._nIn, stats._nIn.med, stats._nIn.md);
      const zNOut = robustZ(row._nOut, stats._nOut.med, stats._nOut.md);

      const featureContribs = [
        {raw:'total_input_amount', z:zIn, value:round6(row._totalIn), med:round6(stats._totalIn.med), dir: zIn>=0?'above':'below'},
        {raw:'total_output_amount', z:zOut, value:round6(row._totalOut), med:round6(stats._totalOut.med), dir: zOut>=0?'above':'below'},
        {raw:'src_ip_burst_count', z:zBurst, value:row._ipBurst, med:round2(stats._ipBurst.med), dir: zBurst>=0?'above':'below'},
        {raw:'num_inputs', z:zNIn, value:row._nIn, med:round2(stats._nIn.med), dir: zNIn>=0?'above':'below'},
        {raw:'num_outputs', z:zNOut, value:row._nOut, med:round2(stats._nOut.med), dir: zNOut>=0?'above':'below'},
        {raw:'is_offhours', z: row._offhours? 3.5 : -1, value:row._offhours, med:0, dir: row._offhours? 'above':'below'},
      ].filter(f=> Math.abs(f.z) > 1.1 || (f.raw==='is_offhours' && row._offhours));

      featureContribs.sort((a,b)=> Math.abs(b.z)-Math.abs(a.z));
      const top = featureContribs.slice(0,4);
      const totalAbsZ = top.reduce((s,f)=>s+Math.abs(f.z),0) || 1;
      top.forEach(f=> f.contribution_pct = Math.round(Math.abs(f.z)/totalAbsZ*1000)/10);

      const anomZ = Math.min(1, (Math.abs(zIn)+Math.abs(zOut)+Math.abs(zBurst)+Math.abs(zNIn)+Math.abs(zNOut))/25);
      const motifBonus = type!=='none' ? 0.42 : 0;
      row._score = Math.min(0.98, Math.round((anomZ*0.55 + motifBonus)*10000)/10000);
      row._features = top.map(f=>({
        feature: FEATURE_LABELS[f.raw]||f.raw, raw:f.raw, value:f.value, direction:f.dir,
        median:f.med, z: Math.round(f.z*10)/10, contribution_pct: f.contribution_pct
      }));
      if(row._features.length===0){
        row._features = [{feature:'Composite Deviation', raw:'composite', value:round6(row._score), direction:'above', median:0, z:0, contribution_pct:100}];
      }
    });

    log(`Motif mining complete. Thresholds: fan-out ≥ ${Math.round(FAN_OUT_THRESH)} outputs, fan-in ≥ ${Math.round(FAN_IN_THRESH)} inputs, peel value ≥ ${totalInQ995.toFixed(3)} (P99.5), IP burst > ${IP_BURST_THRESH} tx/15min.`);

    const ranked = tx.slice().sort((a,b)=> b._score - a._score);
    const MAX_ALERTS = Math.min(300, ranked.length);
    const alerts = ranked.slice(0, MAX_ALERTS).map((row,i)=>{
      const severity = row._score>=0.6?'CRITICAL': row._score>=0.4?'HIGH': row._score>=0.25?'MEDIUM':'LOW';
      return {
        rank: i+1, score: row._score, severity,
        txid: row.txid, timestamp: row.timestamp, src_ip: row.src_ip, dst_ip: row.dst_ip,
        src_country: row.src_country||'Unknown', src_asn: row.src_asn ?? null, src_asn_org: row.src_asn_org || 'Unknown',
        num_inputs: row._nIn, num_outputs: row._nOut,
        total_input: round6(row._totalIn), total_output: round6(row._totalOut), fee: round8(row.fee),
        ip_wallet_diversity: row._ipWalletDiversity,
        is_anomaly: row.is_anomaly!=null ? row.is_anomaly : (row._motif!=='none'?1:0),
        type: row._motif, type_label: TYPE_LABELS[row._motif], type_desc: TYPE_DESC[row._motif],
        features: row._features,
      };
    });
    log(`Ranked ${alerts.length.toLocaleString()} candidate leads by composite risk score.`);

    return { tx, uf, eid, entMembers, alerts };
  }

  /* ======================= GRAPH BUILDER ======================= */
  function buildGraph(pipelineResult, opts){
    opts = opts || {};
    const MAX_FAN = opts.maxFan || 6;
    const AMBIENT_SAMPLE = opts.ambientSample || 45;
    const { tx, eid } = pipelineResult;
    function short(a,n=6){ if(typeof a!=='string') return a; return a.length>n+4? a.slice(0,n)+'…'+a.slice(-4) : a; }

    const addrInIdx = new Map();
    tx.forEach((row,i)=>{
      row.input_addresses.forEach(a=>{
        if(!addrInIdx.has(a)) addrInIdx.set(a, []);
        addrInIdx.get(a).push(i);
      });
    });

    const coreIdx = new Set();
    tx.forEach((row,i)=>{ if(row.is_anomaly===1 || row._motif!=='none') coreIdx.add(i); });
    const extraIdx = new Set();
    coreIdx.forEach(i=>{
      const row = tx[i];
      row.output_addresses.forEach(a=>{
        const cand = (addrInIdx.get(a)||[]).slice(0,2);
        cand.forEach(j=>{ if(tx[j]._ms > row._ms) extraIdx.add(j); });
      });
    });
    const normalPool = [];
    tx.forEach((row,i)=>{ if(!coreIdx.has(i) && !extraIdx.has(i)) normalPool.push(i); });
    const ambientIdx = new Set();
    const poolCopy = normalPool.slice();
    for(let k=0; k<Math.min(AMBIENT_SAMPLE, poolCopy.length); k++){
      const r = Math.floor(Math.random()*poolCopy.length);
      ambientIdx.add(poolCopy[r]);
      poolCopy.splice(r,1);
    }
    const selIdx = new Set([...coreIdx, ...extraIdx, ...ambientIdx]);

    const nodes = new Map();
    const edges = [];
    function addNode(id, type, label, meta){
      if(!nodes.has(id)) nodes.set(id, Object.assign({id, type, label}, meta||{}));
      return nodes.get(id);
    }

    selIdx.forEach(i=>{
      const row = tx[i];
      const txId = 'tx:'+row.txid;
      addNode(txId, 'tx', short(row.txid,8), {
        txid: row.txid, timestamp: row.timestamp, anomaly: row.is_anomaly===1?1:0,
        anomaly_type: row._motif, fee: row.fee, script_type: row.script_type,
        n_inputs: row._nIn, n_outputs: row._nOut, total_in: round6(row._totalIn), total_out: round6(row._totalOut)
      });
      const ipS = 'ip:'+row.src_ip, ipD = 'ip:'+row.dst_ip;
      addNode(ipS, 'ip', row.src_ip, {ip:row.src_ip, country:row.src_country, asn:String(row.src_asn)});
      addNode(ipD, 'ip', row.dst_ip, {ip:row.dst_ip, country:row.dst_country, asn:String(row.dst_asn)});
      edges.push({source:ipS, target:txId, type:'RELAYED', anomaly: row.is_anomaly===1?1:0});
      edges.push({source:txId, target:ipD, type:'RELAYED_TO'});

      const ins = row.input_addresses.map((a,k)=>[a, row.input_amounts[k]||0]).sort((a,b)=>b[1]-a[1]);
      const outs = row.output_addresses.map((a,k)=>[a, row.output_amounts[k]||0]).sort((a,b)=>b[1]-a[1]);
      const shownIn = ins.slice(0,MAX_FAN), hiddenIn = ins.slice(MAX_FAN);
      shownIn.forEach(([a,amt])=>{
        const e = eid(a);
        const wid = 'w:'+a;
        addNode(wid, 'wallet', short(a), {addr:a, entity:e});
        edges.push({source:wid, target:txId, type:'SPENT_FROM', amount:round6(amt), anomaly: row.is_anomaly===1?1:0});
      });
      if(hiddenIn.length){
        const aggId = 'agg-in:'+row.txid;
        const aggAmt = hiddenIn.reduce((s,[,a])=>s+a,0);
        addNode(aggId, 'aggregate', `+${hiddenIn.length} more inputs`, {count:hiddenIn.length, amount:round6(aggAmt), direction:'in'});
        edges.push({source:aggId, target:txId, type:'SPENT_FROM', amount:round6(aggAmt), anomaly: row.is_anomaly===1?1:0, aggregate:true});
      }
      const shownOut = outs.slice(0,MAX_FAN), hiddenOut = outs.slice(MAX_FAN);
      shownOut.forEach(([a,amt])=>{
        const e = eid(a);
        const wid = 'w:'+a;
        addNode(wid, 'wallet', short(a), {addr:a, entity:e});
        edges.push({source:txId, target:wid, type:'OUTPUT_TO', amount:round6(amt), anomaly: row.is_anomaly===1?1:0});
      });
      if(hiddenOut.length){
        const aggId = 'agg-out:'+row.txid;
        const aggAmt = hiddenOut.reduce((s,[,a])=>s+a,0);
        addNode(aggId, 'aggregate', `+${hiddenOut.length} more outputs`, {count:hiddenOut.length, amount:round6(aggAmt), direction:'out'});
        edges.push({source:txId, target:aggId, type:'OUTPUT_TO', amount:round6(aggAmt), anomaly: row.is_anomaly===1?1:0, aggregate:true});
      }
    });

    return { nodes: [...nodes.values()], edges, addrInIdx };
  }

  /* ======================= CHAIN TRACER ======================= */
  function traceChains(pipelineResult, graphInfo, maxChains){
    const { tx } = pipelineResult;
    const addrInIdx = graphInfo.addrInIdx;
    const peelRows = tx.filter(r=>r._motif==='peel_chain');
    const chains = [];
    peelRows.forEach(row=>{
      const outs = row.output_addresses.map((a,k)=>[a, row.output_amounts[k]||0]).sort((a,b)=>b[1]-a[1]);
      if(outs.length<2) return;
      const [bigAddr,bigAmt] = outs[0];
      const [smallAddr,smallAmt] = outs[1];
      const hops = [{hop:0, txid:row.txid, timestamp:row.timestamp,
        peeled_off:{addr:smallAddr, amount:round6(smallAmt)},
        change_forward:{addr:bigAddr, amount:round6(bigAmt)},
        src_ip:row.src_ip, dst_ip:row.dst_ip}];
      let curAddr = bigAddr;
      const seenTx = new Set([row.txid]);
      for(let h=1; h<6; h++){
        const validCand = (addrInIdx.get(curAddr)||[]).filter(j=>{
          return !seenTx.has(tx[j].txid) && new Date(tx[j].timestamp).getTime() > new Date(hops[hops.length-1].timestamp).getTime();
        });
        if(!validCand.length) break;
        const j = validCand[0];
        const r2 = tx[j];
        seenTx.add(r2.txid);
        const outs2 = r2.output_addresses.map((a,k)=>[a, r2.output_amounts[k]||0]).sort((a,b)=>b[1]-a[1]);
        if(!outs2.length) break;
        const [nxtAddr, nxtAmt] = outs2[0];
        const peeled2 = outs2.length>1 ? outs2[1] : null;
        hops.push({hop:h, txid:r2.txid, timestamp:r2.timestamp,
          peeled_off: peeled2 ? {addr:peeled2[0], amount:round6(peeled2[1])} : null,
          change_forward:{addr:nxtAddr, amount:round6(nxtAmt)},
          src_ip:r2.src_ip, dst_ip:r2.dst_ip});
        curAddr = nxtAddr;
      }
      if(hops.length>=2){
        chains.push({seed_txid:row.txid, seed_country:row.src_country||'Unknown', seed_asn:row.src_asn||0,
          total_hops: hops.length-1, hops});
      }
    });
    chains.sort((a,b)=>b.total_hops-a.total_hops);
    return chains.slice(0, maxChains||12);
  }

  /* ======================= OVERVIEW STATS BUILDER ======================= */
  function buildOverview(pipelineResult, alerts){
    const { tx, entMembers } = pipelineResult;
    const anomalyCounts = {};
    tx.forEach(r=>{ if(r._motif!=='none') anomalyCounts[r._motif] = (anomalyCounts[r._motif]||0)+1; });
    const scriptCounts = {};
    tx.forEach(r=>{ const s=r.script_type||'UNKNOWN'; scriptCounts[s]=(scriptCounts[s]||0)+1; });
    const countryCounts = {};
    tx.forEach(r=>{ const c=r.src_country||'Unknown'; countryCounts[c]=(countryCounts[c]||0)+1; });
    const sortedCountries = Object.fromEntries(Object.entries(countryCounts).sort((a,b)=>b[1]-a[1]).slice(0,12));

    const timeline = {}, anomByDate = {};
    tx.forEach(r=>{
      const d = (r.timestamp||'').slice(0,10);
      timeline[d] = (timeline[d]||0)+1;
      if(r._motif!=='none') anomByDate[d] = (anomByDate[d]||0)+1;
    });

    const scores = alerts.map(a=>a.score);
    const minS = Math.min(...scores, 0), maxS = Math.max(...scores, 1);
    const bins = 10;
    const hist = new Array(bins).fill(0);
    const binW = (maxS-minS)/bins || 1;
    scores.forEach(s=>{
      let idx = Math.floor((s-minS)/binW);
      if(idx>=bins) idx = bins-1; if(idx<0) idx=0;
      hist[idx]++;
    });
    const scoreHist = hist.map((c,i)=>({bin:`${(minS+i*binW).toFixed(2)}-${(minS+(i+1)*binW).toFixed(2)}`, count:c}));

    const asnCounts = {};
    alerts.forEach(a=>{ if(a.src_asn_org && a.src_asn_org!=='Unknown') asnCounts[a.src_asn_org]=(asnCounts[a.src_asn_org]||0)+1; });
    const sortedAsn = Object.fromEntries(Object.entries(asnCounts).sort((a,b)=>b[1]-a[1]).slice(0,8));

    const hasLabels = tx.some(r=>r.is_anomaly===1 || r.is_anomaly===0);
    let top50precision = null, top100precision = null, truePositiveAlerts = null;
    if(hasLabels){
      const byTxid = new Map(tx.map(r=>[r.txid, r]));
      const top50 = alerts.slice(0,50), top100 = alerts.slice(0,100);
      const tp = arr => arr.filter(a=>{ const t=byTxid.get(a.txid); return t && t.is_anomaly===1; }).length;
      top50precision = top50.length ? Math.round(tp(top50)/top50.length*1000)/10 : null;
      top100precision = top100.length ? Math.round(tp(top100)/top100.length*1000)/10 : null;
      truePositiveAlerts = alerts.filter(a=>a.is_anomaly===1).length;
    }
    const flaggedTx = tx.filter(r=>r._motif!=='none').length;
    const countries = new Set(tx.map(r=>r.src_country||'Unknown')).size;

    return {
      kpis: {
        total_tx: tx.length, total_wallets: pipelineResult.uf.parent.size, total_entities: entMembers.size,
        deanon_clusters: [...entMembers.values()].filter(s=>s.size>1).length,
        total_alerts: alerts.length, true_positive_alerts: truePositiveAlerts,
        top50_precision: top50precision, top100_precision: top100precision,
        flagged_tx: flaggedTx, countries, has_ground_truth: hasLabels,
      },
      anomaly_counts: anomalyCounts, script_counts: scriptCounts, country_counts: sortedCountries,
      timeline, anom_by_date: anomByDate, score_hist: scoreHist, asn_org_counts: sortedAsn,
    };
  }

  /* ======================= FILE PARSERS ======================= */
  function splitList(v){
    if(v==null) return [];
    if(Array.isArray(v)) return v.map(String).map(s=>s.trim()).filter(Boolean);
    return String(v).split(/[|;]/).map(s=>s.trim()).filter(Boolean);
  }
  function pick(obj, ...names){
    const lower = {};
    Object.keys(obj).forEach(k=> lower[k.toLowerCase().trim()] = obj[k]);
    for(const n of names){ if(lower[n]!=null && lower[n]!=='') return lower[n]; }
    return undefined;
  }
  function normalizeRow(raw, idx){
    const timestamp = pick(raw,'timestamp','time','date') || new Date(Date.now()+idx*1000).toISOString();
    const txid = pick(raw,'txid','tx_id','transaction_id','hash') || ('tx-ingest-'+idx+'-'+Math.random().toString(36).slice(2,8));
    const inAddrRaw = pick(raw,'input_addresses','inputs','sender_addresses','from_addresses');
    const outAddrRaw = pick(raw,'output_addresses','outputs','receiver_addresses','to_addresses');
    const inAmtRaw = pick(raw,'input_amounts','input_amount','amounts_in');
    const outAmtRaw = pick(raw,'output_amounts','output_amount','amounts_out');
    const inputAddresses = splitList(inAddrRaw);
    const outputAddresses = splitList(outAddrRaw);
    let inputAmounts = splitList(inAmtRaw).map(Number).filter(n=>!isNaN(n));
    let outputAmounts = splitList(outAmtRaw).map(Number).filter(n=>!isNaN(n));
    if(inputAmounts.length===0 && inputAddresses.length){
      const t = Number(pick(raw,'total_input_amount','total_input'))||0;
      inputAmounts = inputAddresses.map((_,i)=> i===0 ? t : 0);
    }
    if(outputAmounts.length===0 && outputAddresses.length){
      const t = Number(pick(raw,'total_output_amount','total_output'))||0;
      outputAmounts = outputAddresses.map((_,i)=> i===0 ? t : 0);
    }
    const isAnomRaw = pick(raw,'is_anomaly','label','anomaly');
    let isAnomaly = null;
    if(isAnomRaw!=null && isAnomRaw!=='') {
      const s = String(isAnomRaw).toLowerCase();
      isAnomaly = (s==='1'||s==='true'||s==='yes') ? 1 : (s==='0'||s==='false'||s==='no') ? 0 : null;
    }
    return {
      timestamp, txid,
      src_ip: pick(raw,'src_ip','source_ip','srcip') || 'unknown-src',
      dst_ip: pick(raw,'dst_ip','dest_ip','destination_ip','dstip') || 'unknown-dst',
      src_country: pick(raw,'src_country','source_country') || 'Unknown',
      dst_country: pick(raw,'dst_country','destination_country') || 'Unknown',
      src_asn: pick(raw,'src_asn','source_asn') ?? null,
      dst_asn: pick(raw,'dst_asn','destination_asn') ?? null,
      src_asn_org: pick(raw,'src_asn_org','asn_org','source_asn_org') || 'Unknown',
      input_addresses: inputAddresses, output_addresses: outputAddresses,
      input_amounts: inputAmounts, output_amounts: outputAmounts,
      fee: Number(pick(raw,'fee'))||0,
      script_type: pick(raw,'script_type','scripttype') || 'UNKNOWN',
      is_anomaly: isAnomaly,
      anomaly_type: pick(raw,'anomaly_type','type') || null,
    };
  }

  function parseCSVText(text){
    const res = Papa.parse(text, {header:true, skipEmptyLines:true});
    return res.data;
  }
  function parseJSONText(text){
    const obj = JSON.parse(text);
    if(Array.isArray(obj)) return obj;
    if(obj && Array.isArray(obj.data)) return obj.data;
    if(obj && Array.isArray(obj.transactions)) return obj.transactions;
    if(obj && Array.isArray(obj.records)) return obj.records;
    throw new Error('JSON must be an array of records, or an object with a "data"/"transactions"/"records" array.');
  }
  function parseXMLText(text){
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('Malformed XML document.');
    const root = doc.documentElement;
    // find the most frequent repeated child tag name (the "record" element)
    const tagCounts = {};
    Array.from(root.children).forEach(el=> tagCounts[el.tagName] = (tagCounts[el.tagName]||0)+1);
    let recordTag = null, best = 0;
    Object.entries(tagCounts).forEach(([tag,c])=>{ if(c>best){ best=c; recordTag=tag; } });
    if(!recordTag) throw new Error('No repeated record elements found in XML.');
    const recordEls = Array.from(root.children).filter(el=>el.tagName===recordTag);
    return recordEls.map(el=>{
      const obj = {};
      Array.from(el.attributes||[]).forEach(attr=> obj[attr.name] = attr.value);
      Array.from(el.children).forEach(child=>{
        const grandChildren = Array.from(child.children);
        if(grandChildren.length){
          obj[child.tagName] = grandChildren.map(g=>g.textContent.trim()).join('|');
        } else {
          obj[child.tagName] = child.textContent.trim();
        }
      });
      return obj;
    });
  }

  function detectAndParse(filename, text){
    const lower = filename.toLowerCase();
    const trimmed = text.trim();
    if(lower.endsWith('.json') || trimmed.startsWith('{') || trimmed.startsWith('[')) return parseJSONText(text);
    if(lower.endsWith('.xml') || trimmed.startsWith('<')) return parseXMLText(text);
    return parseCSVText(text);
  }

  /* ======================= UI ======================= */
  const root = document.getElementById('view-ingest');
  root.innerHTML = `
    <div class="section-head">
      <div>
        <div class="section-title">Step 1 · Data Ingestion</div>
        <div class="section-desc">Load bulk P2P network + blockchain transaction metadata (CSV / JSON / XML). bypeel parses, entity-resolves, mines laundering motifs, and ranks leads &mdash; entirely offline, in your browser.</div>
      </div>
    </div>

    <div class="grid g-2" style="margin-bottom:14px;">
      <div class="card">
        <div class="card-head"><div class="card-title"><span class="dot" style="background:var(--sig-teal)"></span>QUICK START — DEMO CORPUS</div></div>
        <div class="card-body">
          <div class="small muted" style="margin-bottom:12px;">Synthetic Bitcoin P2P/transaction dataset modelled on real network + blockchain fields: 10,126 correlated transactions, 200 pre-ranked analyst alerts, 5 laundering motif classes.</div>
          <div class="flex gap-8" style="flex-wrap:wrap; margin-bottom:14px;">
            <span class="badge b-low mono">10,126 TX</span>
            <span class="badge b-low mono">1,776 WALLETS</span>
            <span class="badge b-low mono">200 ALERTS</span>
            <span class="badge b-low mono">10 JURISDICTIONS</span>
          </div>
          <button class="btn primary" id="btn-load-demo" style="width:100%; justify-content:center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            Load Demo Dataset &amp; Analyze
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title"><span class="dot" style="background:var(--blue)"></span>INGEST YOUR OWN METADATA</div></div>
        <div class="card-body flex-col gap-10">
          <div>
            <div class="xsmall faint" style="margin-bottom:5px;">TRANSACTION METADATA (required) · CSV / JSON / XML · multiple files allowed</div>
            <input type="file" id="file-tx" accept=".csv,.json,.xml" multiple
              style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text-dim); padding:8px 9px; font-size:11.5px;">
          </div>
          <div>
            <div class="xsmall faint" style="margin-bottom:5px;">PRE-RANKED ALERTS (optional) · CSV / JSON — if omitted, bypeel's own scorer generates the alert queue</div>
            <input type="file" id="file-alerts" accept=".csv,.json"
              style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text-dim); padding:8px 9px; font-size:11.5px;">
          </div>
          <details style="margin-top:2px;">
            <summary class="xsmall muted" style="cursor:pointer;">Expected schema (columns are matched case-insensitively; missing optional fields default gracefully)</summary>
            <div class="xsmall faint mono" style="margin-top:8px; line-height:1.7; word-break:break-word;">
              timestamp · txid · src_ip · dst_ip · src_country · dst_country · src_asn · src_asn_org ·
              input_addresses (pipe-separated) · output_addresses (pipe-separated) ·
              input_amounts (pipe-separated) · output_amounts (pipe-separated) · fee · script_type ·
              is_anomaly (optional ground truth, 0/1) · anomaly_type (optional)
            </div>
          </details>
          <button class="btn primary" id="btn-process" style="width:100%; justify-content:center; margin-top:4px;" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
            Process Dataset
          </button>
          <label class="flex items-center gap-6 xsmall muted" style="margin-top:8px; cursor:pointer;">
            <input type="checkbox" id="use-python-backend" checked>
            Use Python ML backend (FastAPI + IsolationForest + SHAP) at <code class="mono">/api/process</code> instead of the in-browser engine, if running.
          </label>
          <div id="ingest-error" class="xsmall" style="color:var(--red); display:none;"></div>
        </div>
      </div>
    </div>

    <div class="card" id="ingest-progress-card" style="display:none;">
      <div class="card-head">
        <div class="card-title"><span class="dot" style="background:var(--amber)"></span>PROCESSING PIPELINE</div>
        <div class="card-note" id="ingest-progress-note">RUNNING…</div>
      </div>
      <div class="card-body">
        <div id="ingest-mini-flow" style="margin-bottom:10px;"></div>
        <div id="ingest-log" class="mono xsmall flex-col gap-4 scroll-y" style="max-height:180px; padding:10px; background:var(--surface-2); border-radius:8px; border:1px solid var(--border-soft);"></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="card-head">
        <div class="card-title"><span class="dot" style="background:var(--green)"></span>SAVED CASES (LOCAL DATABASE)</div>
        <div class="card-note"><button class="btn ghost" id="btn-refresh-cases" style="padding:4px 8px;">↻ Refresh</button></div>
      </div>
      <div class="card-body">
        <div class="xsmall muted" style="margin-bottom:10px;">Every dataset processed via the Python ML backend is saved to <code class="mono">data/bypeel.db</code> (SQLite, on your own machine) so you can reopen it instantly without re-running the pipeline.</div>
        <div id="saved-cases-list" class="flex-col gap-6"></div>
      </div>
    </div>
  `;

  // mini pipeline flow (reuses same visual language as Overview)
  (function drawMiniFlow(){
    const stages = ['Parse','Entity Fusion','Motif Mining','Risk Scoring','Ranking','Render'];
    const W=1080, H=64, n=stages.length, gap=W/n, y=H/2;
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;">`;
    for(let i=0;i<n-1;i++){
      const x1=gap*i+gap/2+16, x2=gap*(i+1)+gap/2-16;
      svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#212A3A" stroke-width="2"/>`;
    }
    stages.forEach((s,i)=>{
      const cx = gap*i+gap/2;
      svg += `<circle cx="${cx}" cy="${y}" r="14" fill="#10151E" stroke="#212A3A" stroke-width="1.4" id="ingest-stage-${i}"/>
        <text x="${cx}" y="${y+3}" text-anchor="middle" font-family='Consolas' font-size="9" fill="#545E71" id="ingest-stage-num-${i}">${i+1}</text>
        <text x="${cx}" y="${y+28}" text-anchor="middle" font-family="Inter" font-size="9.5" fill="#8792A6">${s}</text>`;
    });
    svg += `</svg>`;
    document.getElementById('ingest-mini-flow').innerHTML = svg;
  })();

  function setStage(i, state){
    // state: 'active' | 'done'
    const circle = document.getElementById(`ingest-stage-${i}`);
    const num = document.getElementById(`ingest-stage-num-${i}`);
    if(!circle) return;
    if(state==='active'){ circle.setAttribute('stroke','#E8B84B'); circle.setAttribute('fill','#1B222F'); num.setAttribute('fill','#E8B84B'); }
    if(state==='done'){ circle.setAttribute('stroke','#2FE0A8'); circle.setAttribute('fill','#0E1A16'); num.setAttribute('fill','#2FE0A8'); }
  }

  function logLine(msg, tone){
    const box = document.getElementById('ingest-log');
    const line = document.createElement('div');
    line.style.color = tone==='error' ? 'var(--red)' : tone==='ok' ? 'var(--sig-teal)' : 'var(--text-dim)';
    line.textContent = `› ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function showError(msg){
    const el = document.getElementById('ingest-error');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function readFileAsText(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = ()=>reject(new Error('Could not read file: '+file.name));
      r.readAsText(file);
    });
  }
  const sleep = ms => new Promise(r=>setTimeout(r, ms));

  const txInput = document.getElementById('file-tx');
  const alertsInput = document.getElementById('file-alerts');
  const processBtn = document.getElementById('btn-process');
  txInput.addEventListener('change', ()=>{ processBtn.disabled = txInput.files.length===0; showError(''); });

  document.getElementById('btn-load-demo').addEventListener('click', ()=>{
    window.BYPEEL_applyDataset(window.BYPEEL_DEMO_DATA, {label:'Bundled demo corpus', count: window.BYPEEL_DEMO_DATA.overview.kpis.total_tx});
  });

  // ---- Saved Cases (local SQLite DB via /api/cases) ----
  async function loadSavedCases(){
    const listEl = document.getElementById('saved-cases-list');
    if(!listEl) return;
    listEl.innerHTML = `<div class="xsmall faint">Loading…</div>`;
    try{
      const resp = await fetch('/api/cases');
      if(!resp.ok) throw new Error('backend not reachable');
      const cases = await resp.json();
      if(!cases.length){
        listEl.innerHTML = `<div class="xsmall faint" style="padding:10px 0;">No saved cases yet — process a dataset with the Python backend to create one.</div>`;
        return;
      }
      listEl.innerHTML = cases.map(c=>`
        <div class="flex items-center gap-8" style="padding:9px 10px; background:var(--surface-2); border-radius:8px; border:1px solid var(--border-soft);">
          <div style="flex:1; min-width:0;">
            <div class="small truncate" style="color:var(--text);">${c.name}</div>
            <div class="xsmall faint mono">${new Date(c.created_at).toLocaleString()} · ${c.total_tx.toLocaleString()} tx · ${c.total_alerts} alerts · ${c.flagged_tx} flagged</div>
          </div>
          <button class="btn ghost" data-load-case="${c.id}" style="padding:6px 10px;">Open</button>
          <button class="btn ghost" data-del-case="${c.id}" style="padding:6px 8px; color:var(--red);">✕</button>
        </div>`).join('');
      listEl.querySelectorAll('[data-load-case]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          btn.textContent = '…';
          const r = await fetch(`/api/cases/${btn.dataset.loadCase}`);
          const data = await r.json();
          window.BYPEEL_applyDataset(data, {label:'Saved case (SQLite)'});
        });
      });
      listEl.querySelectorAll('[data-del-case]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          await fetch(`/api/cases/${btn.dataset.delCase}`, {method:'DELETE'});
          loadSavedCases();
        });
      });
    } catch(e){
      listEl.innerHTML = `<div class="xsmall faint" style="padding:10px 0;">Python backend not running — start it with <code class="mono">./run.sh</code> or <code class="mono">run.bat</code> to enable saved cases.</div>`;
    }
  }
  document.getElementById('btn-refresh-cases').addEventListener('click', loadSavedCases);
  loadSavedCases();

  processBtn.addEventListener('click', async ()=>{
    showError('');
    const progressCard = document.getElementById('ingest-progress-card');
    progressCard.style.display = 'block';
    document.getElementById('ingest-log').innerHTML = '';
    document.getElementById('ingest-progress-note').textContent = 'RUNNING…';
    for(let i=0;i<6;i++) setStage(i, i===0?'active':'');
    processBtn.disabled = true;

    // ---- Optional: delegate to the Python FastAPI backend (real IsolationForest + SHAP) ----
    if(document.getElementById('use-python-backend').checked){
      try{
        logLine(`Uploading ${txInput.files.length} file(s) to Python backend at /api/process…`);
        setStage(0,'done'); setStage(1,'active');
        const fd = new FormData();
        for(const file of txInput.files) fd.append('tx_files', file);
        const resp = await fetch('/api/process', {method:'POST', body: fd});
        if(!resp.ok){
          const errBody = await resp.json().catch(()=>({error:resp.statusText}));
          throw new Error(`Backend error (${resp.status}): ${errBody.error || resp.statusText}`);
        }
        setStage(1,'done'); setStage(2,'done'); setStage(3,'done'); setStage(4,'done'); setStage(5,'active');
        const data = await resp.json();
        logLine(`Backend pipeline complete: ${data.overview.kpis.total_tx.toLocaleString()} tx, ${data.alerts.length} alerts, ${data.graph.nodes.length} graph nodes.`, 'ok');
        setStage(5,'done');
        document.getElementById('ingest-progress-note').textContent = 'DONE';
        loadSavedCases();
        window.BYPEEL_applyDataset(data, {label:'Python ML Backend (IsolationForest + SHAP)'});
      } catch(err){
        console.error(err);
        showError(err.message || String(err));
        document.getElementById('ingest-progress-note').textContent = 'FAILED';
      } finally {
        processBtn.disabled = false;
      }
      return;
    }

    try{
      // ---- Stage 1: Parse ----
      let allRows = [];
      for(const file of txInput.files){
        logLine(`Reading ${file.name}…`);
        const text = await readFileAsText(file);
        const rawRows = detectAndParse(file.name, text);
        logLine(`Parsed ${rawRows.length.toLocaleString()} raw records from ${file.name}.`);
        allRows.push(...rawRows);
      }
      let normRows = allRows.map((r,i)=>normalizeRow(r,i));
      const seen = new Set();
      const beforeDedup = normRows.length;
      normRows = normRows.filter(r=>{ if(seen.has(r.txid)) return false; seen.add(r.txid); return true; });
      if(beforeDedup !== normRows.length) logLine(`Removed ${beforeDedup-normRows.length} duplicate TXID(s) across ingested files.`);
      normRows = normRows.filter(r=> r.input_addresses.length>0 || r.output_addresses.length>0 || r.src_ip!=='unknown-src');
      if(normRows.length===0) throw new Error('No usable transaction rows found after parsing — check the file format and column names.');
      logLine(`Normalized ${normRows.length.toLocaleString()} unique transaction records.`, 'ok');
      setStage(0,'done'); setStage(1,'active');
      await sleep(120);

      // ---- Stage 2+3: pipeline (entity fusion + motif mining) ----
      const pipelineResult = runPipeline(normRows, (m)=>logLine(m));
      setStage(1,'done'); setStage(2,'done'); setStage(3,'active');
      await sleep(80);

      // ---- Optional custom alerts file ----
      let alerts = pipelineResult.alerts;
      if(alertsInput.files.length){
        const f = alertsInput.files[0];
        logLine(`Reading pre-ranked alerts from ${f.name}…`);
        const text = await readFileAsText(f);
        const rawAlerts = detectAndParse(f.name, text);
        alerts = rawAlerts.map((r,i)=>{
          const feats = [];
          const reason = pick(r,'reason');
          if(reason){
            const pat = /([a-zA-Z_]+)=(-?[\d.]+) \((above|below) median (-?[\d.]+), z=(-?[\d.]+)\)/g;
            let m;
            while((m = pat.exec(reason))){
              feats.push({feature: FEATURE_LABELS[m[1]]||m[1], raw:m[1], value:Number(m[2]), direction:m[3], median:Number(m[4]), z:Number(m[5])});
            }
            feats.sort((a,b)=>Math.abs(b.z)-Math.abs(a.z));
            const totalAbsZ = feats.reduce((s,f)=>s+Math.abs(f.z),0)||1;
            feats.forEach(f=> f.contribution_pct = Math.round(Math.abs(f.z)/totalAbsZ*1000)/10);
          }
          const type = pick(r,'anomaly_type','type') || 'none';
          const score = Number(pick(r,'anomaly_score','score'))||0;
          return {
            rank: Number(pick(r,'rank'))||(i+1), score, severity: score>=0.6?'CRITICAL':score>=0.4?'HIGH':score>=0.25?'MEDIUM':'LOW',
            txid: pick(r,'txid')||('alert-'+i), timestamp: pick(r,'timestamp')||new Date().toISOString(),
            src_ip: pick(r,'src_ip')||'unknown', dst_ip: pick(r,'dst_ip')||'unknown',
            src_country: pick(r,'src_country')||'Unknown', src_asn: pick(r,'src_asn')||null, src_asn_org: pick(r,'src_asn_org')||'Unknown',
            num_inputs: Number(pick(r,'num_inputs'))||0, num_outputs: Number(pick(r,'num_outputs'))||0,
            total_input: Number(pick(r,'total_input_amount','total_input'))||0, total_output: Number(pick(r,'total_output_amount','total_output'))||0,
            fee: Number(pick(r,'fee'))||0, ip_wallet_diversity: Number(pick(r,'ip_wallet_diversity'))||0,
            is_anomaly: pick(r,'is_anomaly')!=null ? Number(pick(r,'is_anomaly')) : 0,
            type, type_label: TYPE_LABELS[type]||type, type_desc: TYPE_DESC[type]||'',
            features: feats.length ? feats.slice(0,4) : [{feature:'Composite Score', raw:'composite', value:score, direction:'above', median:0, z:0, contribution_pct:100}],
          };
        }).sort((a,b)=>a.rank-b.rank);
        logLine(`Loaded ${alerts.length.toLocaleString()} pre-ranked alerts from ${f.name} (overriding internal scorer).`, 'ok');
      }
      setStage(3,'done'); setStage(4,'active');
      await sleep(80);

      // ---- Stage: graph + chains ----
      const graphInfo = buildGraph(pipelineResult);
      logLine(`Constructed heterogeneous graph: ${graphInfo.nodes.length.toLocaleString()} nodes, ${graphInfo.edges.length.toLocaleString()} edges (IP · Wallet · TX, aggregated beyond 6-way fan-out for legibility).`);
      const chains = traceChains(pipelineResult, graphInfo, 12);
      logLine(`Traced ${chains.length} candidate peeling chain${chains.length===1?'':'s'} via forward address-reuse analysis.`);
      setStage(4,'done'); setStage(5,'active');
      await sleep(80);

      const overview = buildOverview(pipelineResult, alerts);
      logLine(`Overview statistics compiled.`, 'ok');
      setStage(5,'done');

      const finalData = { overview, alerts, graph: {nodes:graphInfo.nodes, edges:graphInfo.edges}, chains };
      document.getElementById('ingest-progress-note').textContent = 'COMPLETE';
      logLine(`Pipeline complete. Routing to Overview dashboard…`, 'ok');
      await sleep(500);
      window.BYPEEL_applyDataset(finalData, {label:'Custom ingested dataset', count: normRows.length});

    } catch(err){
      console.error(err);
      document.getElementById('ingest-progress-note').textContent = 'FAILED';
      logLine('ERROR: '+err.message, 'error');
      showError(err.message);
      processBtn.disabled = false;
    }
  });

})();
</script>

<!-- ============================= CENTRAL RE-RENDER ORCHESTRATOR ============================= -->
<script>
window.BYPEEL_applyDataset = function(newData, meta){
  window.BYPEEL_DATA = newData;
  newData.overview._sourceLabel = (meta && meta.label) || 'Bundled Demo Corpus';
  if(typeof renderOverview !== 'undefined') renderOverview._done = false;
  if(typeof initGraphModule !== 'undefined') initGraphModule._done = false;
  if(typeof renderAlertsModule === 'function') renderAlertsModule(newData);

  const overviewTab = document.querySelector('.tab-btn[data-view="overview"]');
  if(overviewTab) overviewTab.click();
};
</script>
