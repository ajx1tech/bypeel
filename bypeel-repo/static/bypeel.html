<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --bg:            #080B10;
  --bg-grid:       #0B0F16;
  --surface:       #10151E;
  --surface-2:     #151B26;
  --surface-3:     #1B222F;
  --border:        #212A3A;
  --border-soft:   #191F2B;
  --text:          #DCE3EE;
  --text-dim:      #8792A6;
  --text-faint:    #545E71;

  --sig-teal:      #2FE0A8;
  --sig-teal-dim:  rgba(47,224,168,0.14);
  --amber:         #E8B84B;
  --amber-dim:     rgba(232,184,75,0.14);

  --red:           #FF5C5C;
  --red-dim:       rgba(255,92,92,0.14);
  --orange:        #FF9A44;
  --orange-dim:    rgba(255,154,68,0.14);
  --blue:          #4C8DFF;
  --blue-dim:      rgba(76,141,255,0.14);
  --green:         #3ECF7E;
  --green-dim:     rgba(62,207,126,0.14);

  --font-display:  'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
  --font-body:     system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
  --font-mono:     'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace;

  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 12px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ color-scheme: dark; }
body{
  background:
    radial-gradient(ellipse 1200px 700px at 15% -10%, rgba(47,224,168,0.055), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(76,141,255,0.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{ background:var(--sig-teal); color:#04140F; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:#2b3548; }

a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
input, select{ font-family:inherit; }
.mono{ font-family:var(--font-mono); }
.tabular{ font-variant-numeric: tabular-nums; }

/* ============================= TOP CHROME ============================= */
.topbar{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:28px;
  padding:0 22px;
  height:58px;
  background:rgba(8,11,16,0.86);
  backdrop-filter: blur(14px) saturate(140%);
  border-bottom:1px solid var(--border-soft);
}
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-mark{ width:26px; height:26px; }
.brand-word{
  font-family:var(--font-display); font-weight:700; font-size:19px;
  letter-spacing:-0.02em; color:var(--text);
}
.brand-word span{ color:var(--sig-teal); }
.brand-sub{
  font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono);
  padding-left:10px; border-left:1px solid var(--border);
  letter-spacing:0.02em;
}

.tabs{ display:flex; gap:2px; height:100%; margin-left:8px; }
.tab-btn{
  display:flex; align-items:center; gap:7px;
  height:100%; padding:0 16px;
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--text-dim); font-size:13px; font-weight:500;
  transition:color .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.tab-btn svg{ width:15px; height:15px; opacity:0.75; }
.tab-btn:hover{ color:var(--text); }
.tab-btn.active{ color:var(--text); border-bottom-color:var(--sig-teal); }
.tab-btn.active svg{ opacity:1; }

.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
.status-pill{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  padding:5px 10px; border:1px solid var(--border); border-radius:20px;
  background:var(--surface);
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--sig-teal); box-shadow:0 0 8px var(--sig-teal); animation:pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

/* ============================= LAYOUT ============================= */
.view{ display:none; padding:22px; max-width:1520px; margin:0 auto; }
.view.active{ display:block; animation:view-in .35s ease; }
@keyframes view-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.section-title{ font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:-0.01em; }
.section-desc{ color:var(--text-dim); font-size:12.5px; max-width:640px; margin-top:3px; }

.card{
  background:linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  position:relative;
}
.card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 0; }
.card-title{ font-size:12.5px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:7px; }
.card-title .dot{ width:6px; height:6px; border-radius:50%; }
.card-note{ font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); }
.card-body{ padding:12px 16px 16px; }

.grid{ display:grid; gap:14px; }
.g-kpis{ grid-template-columns:repeat(6,1fr); }
.g-2{ grid-template-columns:1.3fr 1fr; }
.g-3{ grid-template-columns:repeat(3,1fr); }
.g-main-charts{ grid-template-columns:1.5fr 1fr; }
@media (max-width:1200px){ .g-kpis{ grid-template-columns:repeat(3,1fr); } .g-2,.g-main-charts,.g-3{ grid-template-columns:1fr; } }

/* KPI cards */
.kpi{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:13px 14px; position:relative; overflow:hidden;
}
.kpi::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:2px;
  background:linear-gradient(90deg, var(--sig-teal), transparent);
  opacity:0.6;
}
.kpi-label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; font-family:var(--font-mono); }
.kpi-value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:6px; letter-spacing:-0.01em; }
.kpi-value .unit{ font-size:13px; color:var(--text-dim); font-weight:500; margin-left:2px; }
.kpi-sub{ font-size:11px; color:var(--text-dim); margin-top:3px; }
.kpi-sub.up{ color:var(--sig-teal); }
.kpi-sub.warn{ color:var(--red); }

/* badges */
.badge{ display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px; font-size:10.5px; font-weight:600; font-family:var(--font-mono); letter-spacing:0.02em; }
.badge.b-critical{ background:var(--red-dim); color:var(--red); }
.badge.b-high{ background:var(--orange-dim); color:var(--orange); }
.badge.b-medium{ background:var(--amber-dim); color:var(--amber); }
.badge.b-low{ background:var(--blue-dim); color:var(--blue); }
.badge.b-clean{ background:var(--green-dim); color:var(--green); }

/* buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-md);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  font-size:12.5px; font-weight:500; transition:all .15s ease;
}
.btn:hover{ background:var(--surface-3); border-color:#2c374a; }
.btn.primary{ background:var(--sig-teal); border-color:var(--sig-teal); color:#04140F; font-weight:600; }
.btn.primary:hover{ background:#3cf0b8; }
.btn.ghost{ background:none; border-color:transparent; color:var(--text-dim); }
.btn.ghost:hover{ background:var(--surface-2); color:var(--text); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn svg{ width:14px; height:14px; }

/* scrollable list */
.scroll-y{ overflow-y:auto; }
.scroll-y::-webkit-scrollbar{ width:6px; }

/* misc */
.hr{ height:1px; background:var(--border-soft); border:none; margin:12px 0; }
.flex{ display:flex; }
.flex-col{ display:flex; flex-direction:column; }
.items-center{ align-items:center; }
.justify-between{ justify-content:space-between; }
.gap-6{ gap:6px; } .gap-8{ gap:8px; } .gap-10{ gap:10px; } .gap-14{ gap:14px; }
.muted{ color:var(--text-dim); }
.faint{ color:var(--text-faint); }
.small{ font-size:11.5px; }
.xsmall{ font-size:10.5px; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.tooltip-box{
  position:fixed; pointer-events:none; z-index:999;
  background:#0C1017; border:1px solid var(--border); border-radius:var(--radius-md);
  padding:9px 11px; font-size:11.5px; max-width:260px; box-shadow:0 12px 30px rgba(0,0,0,0.5);
  opacity:0; transition:opacity .1s ease;
}
.tooltip-box.show{ opacity:1; }

/* Loading shimmer for count-up */
@keyframes shimmer{ 0%{ background-position: -200% 0; } 100%{ background-position: 200% 0; } }

/* Focus visibility */
button:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--sig-teal); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
</style>
</head>

<script>
/* ============================= APP BOOTSTRAP ============================= */
const DATA = JSON.parse(document.getElementById('bypeel-data').textContent);
window.BYPEEL_DATA = DATA;
window.BYPEEL_DEMO_DATA = DATA; // kept pristine so "reload demo" always works

const TYPE_COLOR = {
  peel_chain: 'var(--red)',
  round_amount_offhours: 'var(--orange)',
  rapid_fan_out_layering: '#C77DFF',
  fan_in_smurfing: '#FFD166',
  shared_ip_burst: 'var(--blue)',
  none: 'var(--text-faint)',
};
const TYPE_COLOR_HEX = {
  peel_chain: '#FF5C5C',
  round_amount_offhours: '#FF9A44',
  rapid_fan_out_layering: '#C77DFF',
  fan_in_smurfing: '#FFD166',
  shared_ip_burst: '#4C8DFF',
  none: '#545E71',
};

function fmtNum(n, d=0){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:d, minimumFractionDigits:d}); }
function fmtBTC(n){ return Number(n).toFixed(4).replace(/0+$/,'').replace(/\.$/,'') + ' BTC'; }
function shortHash(s, a=8, b=6){ if(!s) return ''; return s.length>a+b ? s.slice(0,a)+'…'+s.slice(-b) : s; }
function severityClass(sev){ return {CRITICAL:'b-critical',HIGH:'b-high',MEDIUM:'b-medium',LOW:'b-low'}[sev] || 'b-low'; }

const tooltip = document.getElementById('tooltip');
function showTooltip(html, x, y){
  tooltip.innerHTML = html;
  tooltip.style.left = (x+14)+'px';
  tooltip.style.top = (y+14)+'px';
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show'); }

/* Tab switching */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    const v = document.getElementById('view-'+btn.dataset.view);
    v.classList.add('active');
    window.dispatchEvent(new CustomEvent('bypeel:tabshown', {detail:btn.dataset.view}));
  });
});

function countUp(el, target, opts={}){
  const dur = opts.dur || 1100;
  const dec = opts.dec || 0;
  const start = performance.now();
  const from = 0;
  function tick(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (target-from)*eased;
    el.textContent = fmtNum(val, dec);
    if(p<1) requestAnimationFrame(tick);
    else el.textContent = fmtNum(target, dec);
  }
  requestAnimationFrame(tick);
}
</script>

<!-- MODULE SCRIPTS -->

      <text x="${cx}" y="${nodeY+50}" text-anchor="middle" font-family='Segoe UI' font-size="12.5" fill="#DCE3EE" font-weight="600">${s.t}</text>
      <text x="${cx}" y="${nodeY+66}" text-anchor="middle" font-family="Inter" font-size="10" fill="#6B7688">${s.d.length>26? s.d.slice(0,26)+'…': s.d}</text>
    </g>`;
  });
  svg += `</svg>`;
  document.getElementById('pipeline-flow').innerHTML = svg;

  // ---- Chart.js defaults ----
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = '#8792A6';
  Chart.defaults.font.size = 11;

  // Timeline chart
  const dates = Object.keys(ov.timeline).sort();
  const volData = dates.map(d=>ov.timeline[d]);
  const anomData = dates.map(d=>ov.anom_by_date[d]||0);
  window.BYPEEL_CHARTS.push(new Chart(document.getElementById('chart-timeline'), {
    type:'line',
    data:{ labels: dates.map(d=>d.slice(5)),
      datasets:[
        { label:'Total TX', data: volData, borderColor:'#4C8DFF', backgroundColor:'rgba(76,141,255,0.08)', fill:true, tension:0.35, pointRadius:0, borderWidth:2 },
        { label:'Flagged', data: anomData, borderColor:'#FF5C5C', backgroundColor:'rgba(255,92,92,0.12)', fill:true, tension:0.35, pointRadius:0, borderWidth:2, yAxisID:'y1' },
      ]},
    options:{ responsive:true, interaction:{mode:'index', intersect:false},
      plugins:{ legend:{ position:'top', align:'end', labels:{boxWidth:9,boxHeight:9,usePointStyle:true} } },
      scales:{
        x:{ grid:{color:'#151B26'}, ticks:{maxTicksLimit:8} },
        y:{ grid:{color:'#151B26'}, title:{display:true,text:'Total TX/day'} },
        y1:{ position:'right', grid:{display:false}, title:{display:true,text:'Flagged/day'} }
      } }
  }));

  // Motif bar chart
  const motifKeys = Object.keys(ov.anomaly_counts);
  window.BYPEEL_CHARTS.push(new Chart(document.getElementById('chart-motif'), {
    type:'bar',
    data:{ labels: motifKeys.map(k=>TYPE_LABELS[k]||k),
      datasets:[{ data: motifKeys.map(k=>ov.anomaly_counts[k]), backgroundColor: motifKeys.map(k=>TYPE_COLOR_HEX[k]||'#8792A6'), borderRadius:5, maxBarThickness:34 }]},
    options:{ responsive:true, indexAxis:'y', plugins:{legend:{display:false}},
      scales:{ x:{ grid:{color:'#151B26'} }, y:{ grid:{display:false} } } }
  }));

  // Score histogram
  window.BYPEEL_CHARTS.push(new Chart(document.getElementById('chart-score'), {
    type:'bar',
    data:{ labels: ov.score_hist.map(b=>b.bin),
      datasets:[{ data: ov.score_hist.map(b=>b.count), backgroundColor:'#E8B84B', borderRadius:4, maxBarThickness:26 }]},
    options:{ responsive:true, plugins:{legend:{display:false}},
      scales:{ x:{ grid:{display:false}, ticks:{maxRotation:60, minRotation:60, font:{size:9}} }, y:{ grid:{color:'#151B26'} } } }
  }));

  // Script type donut
  const scriptKeys = Object.keys(ov.script_counts);
  window.BYPEEL_CHARTS.push(new Chart(document.getElementById('chart-script'), {
    type:'doughnut',
    data:{ labels: scriptKeys, datasets:[{ data: scriptKeys.map(k=>ov.script_counts[k]),
      backgroundColor:['#2FE0A8','#4C8DFF','#E8B84B','#C77DFF','#FF9A44','#FF5C5C'], borderColor:'#10151E', borderWidth:3 }]},
    options:{ responsive:true, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{boxWidth:9,boxHeight:9,usePointStyle:true, padding:12} } } }
  }));

  // ASN chart
  const asnKeys = Object.keys(ov.asn_org_counts);
  window.BYPEEL_CHARTS.push(new Chart(document.getElementById('chart-asn'), {
    type:'bar',
    data:{ labels: asnKeys.map(k=>k.length>18?k.slice(0,18)+'…':k),
      datasets:[{ data: asnKeys.map(k=>ov.asn_org_counts[k]), backgroundColor:'#3ECF7E', borderRadius:4, maxBarThickness:20 }]},
    options:{ responsive:true, indexAxis:'y', plugins:{legend:{display:false}},
      scales:{ x:{ grid:{color:'#151B26'} }, y:{ grid:{display:false}, ticks:{font:{size:10}} } } }
  }));
}

window.addEventListener('bypeel:tabshown', (e)=>{
  if(e.detail==='overview' && !renderOverview._done){ renderOverview._done = true; renderOverview(window.BYPEEL_DATA); }
});
</script>

<!-- ============================= GRAPH EXPLORER MODULE ============================= -->
<script>
function initGraphModule(fullData){
  const graph = fullData.graph;
  const chains = fullData.chains;
  const root = document.getElementById('view-graph');

  root.innerHTML = `

    <div style="display:grid; grid-template-columns:250px 1fr 280px; gap:14px; align-items:start;">

      <!-- LEFT: filters -->
      <div class="card">
        <div class="card-head"><div class="card-title"><span class="dot" style="background:var(--sig-teal)"></span>FILTERS</div></div>
        <div class="card-body flex-col gap-10">
          <div id="link-mode-controls">
          <div>
            <div class="xsmall faint" style="margin-bottom:6px;">SEARCH</div>
            <input id="graph-search" type="text" placeholder="txid, wallet, or IP…" style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 9px; font-size:12px;">
          </div>
          <div>
            <div class="xsmall faint" style="margin-bottom:6px;">NETWORK SCOPE</div>
            <select id="graph-scope" style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 9px; font-size:12px;">
              <option value="flagged">Flagged + 1-hop context</option>
              <option value="full">Full sampled network</option>
            </select>
          </div>
          <div>
            <div class="xsmall faint" style="margin-bottom:6px;">MOTIF TYPE</div>
            <div id="graph-motif-filters" class="flex-col gap-6"></div>
          </div>
          <hr class="hr">
          <div>
            <div class="xsmall faint" style="margin-bottom:6px;">PEELING CHAIN PLAYBACK</div>
            <select id="chain-select" style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 9px; font-size:12px; margin-bottom:8px;">
              <option value="">— select a traced chain —</option>
            </select>
            <button class="btn primary" id="btn-play-chain" style="width:100%; justify-content:center;" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Animate Fund Flow
            </button>
          </div>
          <hr class="hr">
          <div>
            <div class="xsmall faint" style="margin-bottom:6px;">LEGEND</div>
            <div class="flex-col gap-6 xsmall">
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:50%;background:#FF5C5C;display:inline-block;"></span>Flagged illicit TX</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:50%;background:#FF9A44;display:inline-block;"></span>Tainted transit wallet</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:50%;background:#4C8DFF;display:inline-block;"></span>Clean / exchange wallet</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:9px;background:#3ECF7E;display:inline-block;"></span>IP node</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border:1.5px dashed #545E71;border-radius:50%;display:inline-block;"></span>Aggregated (+N) node</div>
            </div>
          </div>
          <label class="flex items-center gap-6 xsmall muted" style="margin-top:4px;">
            <input type="checkbox" id="toggle-geo"> Toggle geographic (ASN risk) overlay
          </label>
          </div>

          <div id="cluster-mode-controls" style="display:none;">
            <div class="small muted" style="margin-bottom:10px; line-height:1.5;">
              Every wallet address is resolved into a logical <b style="color:var(--text);">entity</b> via the Common-Input-Ownership Heuristic (Union-Find): all inputs spent together in one transaction are assumed to share a single controller. Bubble size = wallet count per entity.
            </div>
            <div class="xsmall faint" style="margin-bottom:6px;">SHOW</div>
            <select id="cluster-filter" style="width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 9px; font-size:12px; margin-bottom:10px;">
              <option value="multi">Multi-wallet entities only (de-anonymized)</option>
              <option value="all">All resolved entities</option>
            </select>
            <hr class="hr">
            <div class="xsmall faint" style="margin-bottom:8px;">LEGEND</div>
            <div class="flex-col gap-6 xsmall">
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:50%;background:#FF5C5C;display:inline-block;"></span>Entity linked to flagged TX</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border-radius:50%;background:#3ECF7E;display:inline-block;"></span>Clean entity</div>
              <div class="flex items-center gap-6"><span style="width:9px;height:9px;border:1.5px solid #E8B84B;border-radius:50%;display:inline-block;"></span>Multi-wallet (de-anonymized)</div>
              <div class="flex items-center gap-6"><span style="width:6px;height:6px;border-radius:50%;background:#4C8DFF;display:inline-block;"></span>Member wallet address</div>
            </div>
            <div class="hr"></div>
            <div id="cluster-stats" class="flex-col gap-4 xsmall"></div>
          </div>
        </div>
      </div>

      <!-- CENTER: canvas -->
      <div class="card" style="height:640px; overflow:hidden;">
        <div class="card-head">
          <div class="card-title"><span class="dot" style="background:var(--blue)"></span><span id="canvas-title">NODE-LINK CANVAS</span></div>
          <div class="card-note" id="graph-count-note">— nodes</div>
        </div>
        <div id="graph-canvas" style="width:100%; height:590px; position:relative; cursor:grab;"></div>
      </div>

      <!-- RIGHT: detail drawer -->
      <div class="card" style="height:640px; display:flex; flex-direction:column;">
        <div class="card-head"><div class="card-title"><span class="dot" style="background:var(--amber)"></span>ENTITY DOSSIER</div></div>
        <div class="card-body scroll-y" id="entity-drawer" style="flex:1;">
          <div class="muted small" style="padding:20px 0; text-align:center;">
            Double-click a node on the canvas to inspect its 2-hop fund-flow neighborhood, associated entity cluster, and timeline.
          </div>
        </div>
      </div>
    </div>
  `;

  // ---------------- motif filter checkboxes ----------------
  const MOTIFS = [
    {k:'peel_chain', label:'Peeling Chain', color:'#FF5C5C'},
    {k:'round_amount_offhours', label:'Round-Amount Off-Hours', color:'#FF9A44'},
    {k:'rapid_fan_out_layering', label:'Rapid Fan-Out', color:'#C77DFF'},
    {k:'fan_in_smurfing', label:'Fan-In Smurfing', color:'#FFD166'},
    {k:'shared_ip_burst', label:'Shared-IP Burst', color:'#4C8DFF'},
  ];
  const motifFilterState = new Set(MOTIFS.map(m=>m.k));
  document.getElementById('graph-motif-filters').innerHTML = MOTIFS.map(m=>`
    <label class="flex items-center gap-6 xsmall" style="cursor:pointer;">
      <input type="checkbox" data-motif="${m.k}" checked style="accent-color:${m.color};">
      <span style="width:8px;height:8px;border-radius:50%;background:${m.color};display:inline-block;"></span>
      ${m.label}
    </label>`).join('');

  // ---------------- chain select ----------------
  const chainSel = document.getElementById('chain-select');
  chains.forEach((c,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${shortHash(c.seed_txid,6,4)} · ${c.total_hops}-hop peel (${c.seed_country})`;
    chainSel.appendChild(opt);
  });

  // ================= D3 FORCE GRAPH =================
  const container = document.getElementById('graph-canvas');
  let width = container.clientWidth || container.getBoundingClientRect().width || 1100;
  let height = container.clientHeight || container.getBoundingClientRect().height || 590;
  if(width < 50) width = 1100;
  if(height < 50) height = 590;
  let svg = d3.select(container).append('svg').attr('width','100%').attr('height','100%').attr('viewBox',[0,0,width,height]);
  let zoomLayer = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.15,5]).on('zoom', (ev)=> zoomLayer.attr('transform', ev.transform)));

  let linkLayer = zoomLayer.append('g').attr('stroke-opacity',0.5);
  let nodeLayer = zoomLayer.append('g');
  let labelLayer = zoomLayer.append('g');

  function nodeColor(n){
    if(n.type==='ip') return '#3ECF7E';
    if(n.type==='aggregate') return '#545E71';
    if(n.type==='tx'){
      if(n.anomaly===1) return '#FF5C5C';
      return '#8792A6';
    }
    // wallet
    if(n._tainted) return '#FF9A44';
    return '#4C8DFF';
  }
  function nodeRadius(n){
    if(n.type==='tx') return n.anomaly===1 ? 7.5 : 5;
    if(n.type==='ip') return 6.5;
    if(n.type==='aggregate') return 6;
    return 4.3;
  }
  function nodeShapePath(n){
    // returns SVG symbol string offsets not needed; we use circles + a diamond overlay for tx via CSS class
    return null;
  }

  // build lookup for taint propagation (mark wallets connected to flagged tx as tainted, 1-hop)
  const nodesById = {};
  graph.nodes.forEach(n=> nodesById[n.id] = Object.assign({}, n));
  graph.edges.forEach(e=>{
    const s = nodesById[e.source], t = nodesById[e.target];
    if(e.anomaly===1){
      if(s && s.type==='wallet') s._tainted = true;
      if(t && t.type==='wallet') t._tainted = true;
    }
  });

  let simulation, linkSel, nodeSel, labelSel;
  let currentNodes = [], currentLinks = [];

  function computeVisible(){
    const scope = document.getElementById('graph-scope').value;
    const q = document.getElementById('graph-search').value.trim().toLowerCase();

    let txIds;
    if(scope==='flagged'){
      txIds = new Set(graph.nodes.filter(n=>n.type==='tx' && (n.anomaly===1)).map(n=>n.id));
      // add 1-hop neighbors of those tx
    } else {
      txIds = new Set(graph.nodes.filter(n=>n.type==='tx').map(n=>n.id));
    }
    // filter by motif
    const allowedTx = new Set(graph.nodes.filter(n=> n.type==='tx' &&
        (n.anomaly!==1 || motifFilterState.has(n.anomaly_type)) ).map(n=>n.id));

    let keptTx = new Set([...txIds].filter(id=>allowedTx.has(id)));

    let keptNodeIds = new Set(keptTx);
    graph.edges.forEach(e=>{
      if(keptTx.has(e.source)) keptNodeIds.add(e.target);
      if(keptTx.has(e.target)) keptNodeIds.add(e.source);
    });

    let nodes = graph.nodes.filter(n=>keptNodeIds.has(n.id)).map(n=>Object.assign({}, nodesById[n.id]));

    if(q){
      const matchIds = new Set(nodes.filter(n=>{
        return (n.txid && n.txid.toLowerCase().includes(q)) ||
               (n.addr && n.addr.toLowerCase().includes(q)) ||
               (n.ip && n.ip.toLowerCase().includes(q)) ||
               (n.label && n.label.toLowerCase().includes(q));
      }).map(n=>n.id));
      if(matchIds.size){
        const expand = new Set(matchIds);
        graph.edges.forEach(e=>{
          if(matchIds.has(e.source)) expand.add(e.target);
          if(matchIds.has(e.target)) expand.add(e.source);
        });
        nodes = nodes.filter(n=>expand.has(n.id));
      }
    }

    const nodeIdSet = new Set(nodes.map(n=>n.id));
    const links = graph.edges.filter(e=>nodeIdSet.has(e.source)&&nodeIdSet.has(e.target))
      .map(e=>Object.assign({}, e));

    return {nodes, links};
  }

  function render(){
    // re-measure in case the container was laid out after module init (e.g. first tab visit)
    const cw = container.clientWidth, ch = container.clientHeight;
    if(cw > 50) width = cw;
    if(ch > 50) height = ch;
    svg.attr('viewBox', [0,0,width,height]);

    const {nodes, links} = computeVisible();
    currentNodes = nodes; currentLinks = links;
    document.getElementById('graph-count-note').textContent = `${nodes.length} nodes · ${links.length} edges`;

    if(simulation) simulation.stop();
    linkLayer.selectAll('*').remove();
    nodeLayer.selectAll('*').remove();
    labelLayer.selectAll('*').remove();

    // seed initial positions so the very first paint is never blank, regardless
    // of whether the animation-frame ticker gets throttled by the browser
    nodes.forEach((d)=>{
      d.x = width/2 + (Math.random()-0.5)*Math.min(width,height)*0.6;
      d.y = height/2 + (Math.random()-0.5)*Math.min(width,height)*0.6;
    });

    simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d=>d.id).distance(d=> d.type==='RELAYED'||d.type==='RELAYED_TO' ? 55 : 34).strength(0.35))
      .force('charge', d3.forceManyBody().strength(-70).distanceMax(340))
      .force('center', d3.forceCenter(width/2, height/2))
      .force('collision', d3.forceCollide().radius(d=>nodeRadius(d)+3))
      .alpha(1).alphaDecay(0.028);

    // pre-warm the layout synchronously so nodes have real, stable coordinates
    // the instant we paint (fixes the "blank canvas" issue on first render)
    simulation.stop();
    const WARM_TICKS = Math.min(180, Math.max(60, Math.round(6000/Math.max(1,nodes.length))));
    for(let i=0;i<WARM_TICKS;i++) simulation.tick();

    linkSel = linkLayer.selectAll('line').data(links).join('line')
      .attr('stroke', d=> d.anomaly===1 ? '#FF5C5C' : '#26304199')
      .attr('stroke-width', d=> d.aggregate ? 1 : (d.anomaly===1?1.6:0.9))
      .attr('stroke-dasharray', d=> d.aggregate ? '2,2' : null)
      .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);

    nodeSel = nodeLayer.selectAll('circle').data(nodes, d=>d.id).join('circle')
      .attr('r', nodeRadius)
      .attr('fill', nodeColor)
      .attr('stroke', d=> d.type==='tx' && d.anomaly===1 ? '#FFB3B3' : '#080B10')
      .attr('stroke-width', d=> d.type==='tx' && d.anomaly===1 ? 1.4 : 0.8)
      .attr('cx', d=>d.x).attr('cy', d=>d.y)
      .style('cursor','pointer')
      .call(d3.drag()
        .on('start', (ev,d)=>{ if(!ev.active) simulation.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
        .on('drag', (ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
        .on('end', (ev,d)=>{ if(!ev.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
      .on('mouseenter', (ev,d)=>{
        showTooltip(nodeTooltipHtml(d), ev.clientX, ev.clientY);
        d3.select(ev.currentTarget).attr('stroke','#fff').attr('stroke-width',2);
      })
      .on('mousemove', (ev)=>{ tooltip.style.left=(ev.clientX+14)+'px'; tooltip.style.top=(ev.clientY+14)+'px'; })
      .on('mouseleave', (ev,d)=>{
        hideTooltip();
        d3.select(ev.currentTarget).attr('stroke', d.type==='tx'&&d.anomaly===1?'#FFB3B3':'#080B10').attr('stroke-width', d.type==='tx'&&d.anomaly===1?1.4:0.8);
      })
      .on('dblclick', (ev,d)=> openEntityDrawer(d));

    labelSel = labelLayer.selectAll('text').data(nodes.filter(n=>n.type==='tx'||n.type==='ip'), d=>d.id).join('text')
      .text(d=> d.type==='ip' ? d.ip : shortHash(d.txid,5,3))
      .attr('font-size', 8.5).attr('font-family','Consolas').attr('fill','#6B7688')
      .attr('text-anchor','middle').attr('dy', d=>-nodeRadius(d)-4)
      .attr('x',d=>d.x).attr('y',d=>d.y)
      .style('pointer-events','none').style('user-select','none');

    simulation.on('tick', ()=>{
      linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeSel.attr('cx',d=>d.x).attr('cy',d=>d.y);
      labelSel.attr('x',d=>d.x).attr('y',d=>d.y);
    });

    // continue with a gentle settle animation from the pre-warmed state
    simulation.alpha(0.25).restart();
  }

  function nodeTooltipHtml(d){
    if(d.type==='tx'){
      return `<div class="mono" style="color:#DCE3EE; margin-bottom:4px;">TX ${shortHash(d.txid,10,6)}</div>
        <div class="faint xsmall">${d.timestamp}</div>
        <div class="small" style="margin-top:5px;">In: ${d.total_in} BTC · Out: ${d.total_out} BTC</div>
        <div class="small">Inputs: ${d.n_inputs} · Outputs: ${d.n_outputs}</div>
        ${d.anomaly===1?`<div style="margin-top:5px;" class="badge b-critical">${d.anomaly_type.replace(/_/g,' ')}</div>`:'<div class="xsmall muted" style="margin-top:5px;">No anomaly flag</div>'}`;
    }
    if(d.type==='ip'){
      return `<div class="mono" style="color:#DCE3EE;">${d.ip}</div><div class="small muted">${d.country||'Unknown'} · ASN ${d.asn||'—'}</div>`;
    }
    if(d.type==='aggregate'){
      return `<div style="color:#DCE3EE;">${d.label}</div><div class="small muted">Combined ${d.direction==='in'?'input':'output'} amount: ${d.amount} BTC</div>`;
    }
    return `<div class="mono" style="color:#DCE3EE; word-break:break-all;">${d.addr}</div><div class="small muted">Entity ${d.entity}${d._tainted?' · tainted transit':''}</div>`;
  }

  function openEntityDrawer(d){
    const drawer = document.getElementById('entity-drawer');
    // 2-hop neighbors
    const neigh1 = new Set();
    currentLinks.forEach(l=>{
      const sId = l.source.id||l.source, tId=l.target.id||l.target;
      if(sId===d.id) neigh1.add(tId);
      if(tId===d.id) neigh1.add(sId);
    });
    const neigh2 = new Set();
    currentLinks.forEach(l=>{
      const sId = l.source.id||l.source, tId=l.target.id||l.target;
      if(neigh1.has(sId)) neigh2.add(tId);
      if(neigh1.has(tId)) neigh2.add(sId);
    });
    const allNeigh = new Set([...neigh1,...neigh2]);
    allNeigh.delete(d.id);
    const neighNodes = currentNodes.filter(n=>allNeigh.has(n.id));

    let header, meta;
    if(d.type==='tx'){
      header = `TX ${shortHash(d.txid,12,8)}`;
      meta = `
        <div class="small muted">${d.timestamp}</div>
        <div class="flex gap-8" style="margin-top:8px; flex-wrap:wrap;">
          <div class="badge ${d.anomaly===1?'b-critical':'b-clean'}">${d.anomaly===1? d.anomaly_type.replace(/_/g,' ') : 'no anomaly flag'}</div>
          <div class="badge b-low">${d.script_type||''}</div>
        </div>
        <div class="hr"></div>
        <div class="small flex justify-between"><span class="muted">Total Input</span><span class="mono">${d.total_in} BTC</span></div>
        <div class="small flex justify-between"><span class="muted">Total Output</span><span class="mono">${d.total_out} BTC</span></div>
        <div class="small flex justify-between"><span class="muted">Fee</span><span class="mono">${d.fee}</span></div>
        <div class="small flex justify-between"><span class="muted">Inputs / Outputs</span><span class="mono">${d.n_inputs} / ${d.n_outputs}</span></div>`;
    } else if(d.type==='ip'){
      header = d.ip;
      meta = `
        <div class="small flex justify-between"><span class="muted">Country</span><span class="mono">${d.country||'Unknown'}</span></div>
        <div class="small flex justify-between"><span class="muted">ASN</span><span class="mono">${d.asn||'—'}</span></div>`;
    } else if(d.type==='aggregate'){
      header = d.label;
      meta = `<div class="small muted">Aggregated ${d.direction==='in'?'inputs':'outputs'} not individually rendered for graph legibility.</div>
        <div class="small flex justify-between" style="margin-top:6px;"><span class="muted">Combined amount</span><span class="mono">${d.amount} BTC</span></div>
        <div class="small flex justify-between"><span class="muted">Member wallets</span><span class="mono">${d.count}</span></div>`;
    } else {
      header = 'Wallet';
      meta = `
        <div class="mono xsmall" style="word-break:break-all; color:var(--text-dim);">${d.addr}</div>
        <div class="flex gap-8" style="margin-top:8px;">
          <div class="badge b-low">Entity ${d.entity}</div>
          ${d._tainted?'<div class="badge b-high">tainted transit</div>':'<div class="badge b-clean">clean / exchange</div>'}
        </div>`;
    }

    drawer.innerHTML = `
      <div class="mono" style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; word-break:break-all;">${header}</div>
      ${meta}
      <div class="hr"></div>
      <div class="xsmall faint" style="margin-bottom:8px;">2-HOP NEIGHBORHOOD (${neighNodes.length})</div>
      <div class="flex-col gap-6">
        ${neighNodes.slice(0,25).map(n=>`
          <div class="flex items-center gap-8" style="padding:6px 8px; background:var(--surface-2); border-radius:6px; border:1px solid var(--border-soft);">
            <span style="width:7px;height:7px;border-radius:50%;background:${nodeColor(n)};flex-shrink:0;"></span>
            <span class="mono xsmall truncate" style="flex:1;">${n.type==='ip'?n.ip : n.type==='tx'? shortHash(n.txid,8,4): n.type==='aggregate'? n.label : shortHash(n.addr,8,4)}</span>
            <span class="xsmall faint">${n.type}</span>
          </div>`).join('')}
        ${neighNodes.length>25?`<div class="xsmall faint" style="text-align:center; padding:4px;">+${neighNodes.length-25} more not shown</div>`:''}
      </div>
    `;
  }

  // ---------------- Chain playback animation ----------------
  function playChain(chain){
    // Build a focused mini-view along the chain hops using flowing dashed lines overlay on top of current canvas.
    const drawer = document.getElementById('entity-drawer');
    drawer.innerHTML = `
      <div class="mono" style="font-size:13px; font-weight:600; margin-bottom:4px;">Peeling Chain · ${chain.total_hops} hops</div>
      <div class="small muted" style="margin-bottom:10px;">Seed TX ${shortHash(chain.seed_txid,10,6)} originating ${chain.seed_country}, ASN ${chain.seed_asn}</div>
      <div class="flex-col gap-8" id="chain-hop-list"></div>
    `;
    const list = document.getElementById('chain-hop-list');
    chain.hops.forEach((h,i)=>{
      const row = document.createElement('div');
      row.className = 'flex-col gap-6';
      row.style = 'padding:9px 10px; background:var(--surface-2); border-left:2px solid var(--red); border-radius:6px; opacity:0; transform:translateX(-8px); transition:all .4s ease;';
      row.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="mono xsmall" style="color:var(--red);">HOP ${h.hop}</span>
          <span class="xsmall faint">${h.timestamp}</span>
        </div>
        <div class="mono xsmall truncate">TX ${shortHash(h.txid,8,4)}</div>
        ${h.peeled_off?`<div class="xsmall" style="color:var(--orange);">⤷ peeled ${h.peeled_off.amount} BTC → ${shortHash(h.peeled_off.addr,6,4)}</div>`:''}
        <div class="xsmall" style="color:var(--sig-teal);">⤷ forwarded ${h.change_forward.amount} BTC → ${shortHash(h.change_forward.addr,6,4)}</div>
      `;
      list.appendChild(row);
      setTimeout(()=>{ row.style.opacity=1; row.style.transform='translateX(0)'; }, i*450);
    });

    // highlight matching tx nodes in canvas if present, pulse them
    const seedNodeId = 'tx:'+chain.seed_txid;
    nodeSel.attr('opacity', n=>{
      const inChain = chain.hops.some(h=>('tx:'+h.txid)===n.id);
      return inChain ? 1 : 0.18;
    });
    linkSel.attr('opacity', l=>{
      const sId = l.source.id||l.source, tId = l.target.id||l.target;
      const inChain = chain.hops.some(h=>('tx:'+h.txid)===sId || ('tx:'+h.txid)===tId);
      return inChain ? 1 : 0.06;
    });
    setTimeout(()=>{ nodeSel.attr('opacity',1); linkSel.attr('opacity',null); }, chain.hops.length*450 + 3500);
  }

  // ---------------- wire up controls ----------------
  document.getElementById('graph-scope').addEventListener('change', render);
  document.getElementById('graph-search').addEventListener('input', debounce(render, 350));
  document.querySelectorAll('#graph-motif-filters input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) motifFilterState.add(cb.dataset.motif); else motifFilterState.delete(cb.dataset.motif);
      render();
    });
  });
  document.getElementById('btn-reset-graph').addEventListener('click', ()=>{
    document.getElementById('graph-search').value='';
    document.getElementById('graph-scope').value='flagged';
    motifFilterState.clear(); MOTIFS.forEach(m=>motifFilterState.add(m.k));
    document.querySelectorAll('#graph-motif-filters input').forEach(cb=>cb.checked=true);
    render();
    svg.transition().duration(400).call(d3.zoom().transform, d3.zoomIdentity);
  });
  chainSel.addEventListener('change', ()=>{
    document.getElementById('btn-play-chain').disabled = chainSel.value==='';
  });
  document.getElementById('btn-play-chain').addEventListener('click', ()=>{
    if(chainSel.value==='') return;
    playChain(chains[+chainSel.value]);
  });
  document.getElementById('toggle-geo').addEventListener('change', (e)=>{
    if(e.target.checked){
      nodeSel.filter(d=>d.type==='ip').attr('stroke', d=> (d.asn==='None'||!d.asn) ? '#FF5C5C' : '#3ECF7E').attr('stroke-width',2.4);
      labelSel.filter(d=>d.type==='ip').text(d=>`${d.ip} · ${d.country||'??'}`);
    } else {
      nodeSel.filter(d=>d.type==='ip').attr('stroke','#080B10').attr('stroke-width',0.8);
      labelSel.filter(d=>d.type==='ip').text(d=>d.ip);
    }
  });

  function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

  // ================= ENTITY CLUSTER VIEW (Union-Find / CIOH) =================
  // Groups every wallet node by its resolved `entity` id (computed server/pipeline-side
  // via Union-Find over shared transaction inputs) into a packed-circle cluster map —
  // the direct visual interpretation of the CIOH entity-resolution graph engine.
  function buildEntityIndex(){
    const byEntity = new Map();
    graph.nodes.filter(n=>n.type==='wallet').forEach(n=>{
      if(!byEntity.has(n.entity)) byEntity.set(n.entity, []);
      byEntity.get(n.entity).push(n);
    });
    // determine risk: does any member wallet touch a flagged tx? (via edges)
    const walletRisk = new Map();
    graph.edges.forEach(e=>{
      if(e.anomaly===1){
        const s = typeof e.source==='string'?e.source:e.source.id;
        const t = typeof e.target==='string'?e.target:e.target.id;
        if(s && s.startsWith('w:')) walletRisk.set(s, true);
        if(t && t.startsWith('w:')) walletRisk.set(t, true);
      }
    });
    return [...byEntity.entries()].map(([entity, wallets])=>({
      entity, wallets,
      size: wallets.length,
      tainted: wallets.some(w=>walletRisk.has(w.id)),
    }));
  }

  let clusterSvg = null;
  function renderClusters(){
    const cw = container.clientWidth || 1100, ch = container.clientHeight || 590;
    document.getElementById('canvas-title').textContent = 'ENTITY CLUSTER MAP';
    container.innerHTML = '';
    const filterVal = document.getElementById('cluster-filter').value;
    let entities = buildEntityIndex();
    if(filterVal==='multi') entities = entities.filter(e=>e.size>1);
    entities.sort((a,b)=>b.size-a.size);

    document.getElementById('graph-count-note').textContent = `${entities.length} entities · ${entities.reduce((s,e)=>s+e.size,0)} wallets`;
    const multiCount = buildEntityIndex().filter(e=>e.size>1).length;
    const totalEnt = buildEntityIndex().length;
    document.getElementById('cluster-stats').innerHTML = `
      <div class="flex justify-between"><span class="muted">Total resolved entities</span><span class="mono">${totalEnt}</span></div>
      <div class="flex justify-between"><span class="muted">Multi-wallet (de-anon)</span><span class="mono" style="color:var(--amber);">${multiCount}</span></div>
      <div class="flex justify-between"><span class="muted">Shown on canvas</span><span class="mono">${entities.length}</span></div>
    `;

    if(!entities.length){
      container.innerHTML = `<div class="muted small" style="padding:40px; text-align:center;">No multi-wallet entities in the current ingested corpus. Switch to "All resolved entities" to see every singleton wallet cluster.</div>`;
      return;
    }

    const root = d3.hierarchy({children: entities}).sum(d=>d.size || 1);
    const pack = d3.pack().size([cw-8, ch-8]).padding(entities.length>60?3:8);
    pack(root);

    clusterSvg = d3.select(container).append('svg').attr('width','100%').attr('height','100%')
      .attr('viewBox',[0,0,cw,ch]);
    const zLayer = clusterSvg.append('g');
    clusterSvg.call(d3.zoom().scaleExtent([0.3,6]).on('zoom', ev=> zLayer.attr('transform', ev.transform)));

    const g = zLayer.selectAll('g.entity-cluster').data(root.children||[]).join('g')
      .attr('class','entity-cluster')
      .attr('transform', d=>`translate(${d.x},${d.y})`)
      .style('cursor','pointer');

    g.append('circle')
      .attr('r', d=>d.r)
      .attr('fill', d=> d.data.tainted ? 'rgba(255,92,92,0.10)' : 'rgba(62,207,126,0.08)')
      .attr('stroke', d=> d.data.size>1 ? '#E8B84B' : (d.data.tainted?'#FF5C5C':'#3ECF7E'))
      .attr('stroke-width', d=> d.data.size>1 ? 1.8 : 1)
      .on('mouseenter', (ev,d)=>{
        showTooltip(`<div class="mono" style="color:#DCE3EE;">${d.data.entity}</div>
          <div class="small" style="margin-top:3px;">${d.data.size} wallet${d.data.size>1?'s':''} · ${d.data.tainted?'linked to flagged TX':'no flags observed'}</div>`, ev.clientX, ev.clientY);
      })
      .on('mousemove', ev=>{ tooltip.style.left=(ev.clientX+14)+'px'; tooltip.style.top=(ev.clientY+14)+'px'; })
      .on('mouseleave', hideTooltip)
      .on('click', (ev,d)=> openClusterDrawer(d.data));

    // member wallet dots inside each cluster (small, packed visually via jitter within radius)
    g.each(function(d){
      const grp = d3.select(this);
      const n = d.data.wallets.length;
      const rr = d.r;
      d.data.wallets.slice(0,40).forEach((w,i)=>{
        const ang = (i/n)*2*Math.PI + (d.data.entity.charCodeAt(1)||0);
        const rad = n>1 ? rr*0.55*Math.sqrt((i+1)/n) : 0;
        grp.append('circle')
          .attr('cx', Math.cos(ang)*rad).attr('cy', Math.sin(ang)*rad)
          .attr('r', Math.max(2, Math.min(4, rr/6)))
          .attr('fill', '#4C8DFF').attr('opacity',0.85);
      });
    });

    g.filter(d=>d.r>16).append('text')
      .attr('text-anchor','middle').attr('dy', d=>d.r+13)
      .attr('font-size',9).attr('font-family','Consolas').attr('fill','#8792A6')
      .text(d=>`${d.data.entity} · ${d.data.size}w`);
  }

  function openClusterDrawer(clusterData){
    const drawer = document.getElementById('entity-drawer');
    drawer.innerHTML = `
      <div class="mono" style="font-size:13px; font-weight:600; margin-bottom:6px;">${clusterData.entity}</div>
      <div class="flex gap-8" style="margin-bottom:10px;">
        <span class="badge ${clusterData.size>1?'b-medium':'b-low'}">${clusterData.size} wallet${clusterData.size>1?'s':''}</span>
        <span class="badge ${clusterData.tainted?'b-critical':'b-clean'}">${clusterData.tainted?'linked to flagged TX':'clean'}</span>
      </div>
      ${clusterData.size>1?`<div class="small muted" style="margin-bottom:10px;">Resolved as ONE controller via Common-Input-Ownership: these ${clusterData.size} addresses were observed spending together as joint inputs of the same transaction(s), so Union-Find merged them into a single logical entity.</div>`:''}
      <div class="hr"></div>
      <div class="xsmall faint" style="margin-bottom:8px;">MEMBER WALLET ADDRESSES</div>
      <div class="flex-col gap-6">
        ${clusterData.wallets.slice(0,30).map(w=>`
          <div class="flex items-center gap-8" style="padding:6px 8px; background:var(--surface-2); border-radius:6px; border:1px solid var(--border-soft);">
            <span style="width:7px;height:7px;border-radius:50%;background:#4C8DFF;flex-shrink:0;"></span>
            <span class="mono xsmall truncate" style="flex:1;">${w.addr}</span>
          </div>`).join('')}
        ${clusterData.wallets.length>30?`<div class="xsmall faint" style="text-align:center;">+${clusterData.wallets.length-30} more not shown</div>`:''}
      </div>
    `;
  }

  let currentMode = 'link';
  document.querySelectorAll('.view-mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.mode===currentMode) return;
      document.querySelectorAll('.view-mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      if(currentMode==='cluster'){
        document.getElementById('link-mode-controls').style.display='none';
        document.getElementById('cluster-mode-controls').style.display='block';
        if(simulation) simulation.stop();
        renderClusters();
      } else {
        document.getElementById('link-mode-controls').style.display='block';
        document.getElementById('cluster-mode-controls').style.display='none';
        document.getElementById('canvas-title').textContent = 'NODE-LINK CANVAS';
        container.innerHTML = '';
        // re-append the persistent link-mode svg (rebuild since we wiped container)
        rebuildLinkSvg();
        render();
      }
    });
  });
  document.getElementById('cluster-filter').addEventListener('change', renderClusters);

  function rebuildLinkSvg(){
    const newSvg = d3.select(container).append('svg').attr('width','100%').attr('height','100%').attr('viewBox',[0,0,width,height]);
    const newZoomLayer = newSvg.append('g');
    newSvg.call(d3.zoom().scaleExtent([0.15,5]).on('zoom', (ev)=> newZoomLayer.attr('transform', ev.transform)));
    svg = newSvg;
    zoomLayer = newZoomLayer;
    linkLayer = zoomLayer.append('g').attr('stroke-opacity',0.5);
    nodeLayer = zoomLayer.append('g');
    labelLayer = zoomLayer.append('g');
  }

  render();
}

window.addEventListener('bypeel:tabshown', (e)=>{
  if(e.detail==='graph' && !initGraphModule._done){ initGraphModule._done = true; setTimeout(()=>initGraphModule(window.BYPEEL_DATA), 30); }
});
</script>

<!-- ============================= ALERTS MODULE ============================= -->
<script>
window.__DOSSIER__ = { selected: new Map() };

function renderAlertsModule(fullData){
  const alerts = fullData.alerts;
  const root = document.getElementById('view-alerts');

  root.innerHTML = `
    <div class="section-head">
      <div>
        <div class="section-title">Prioritized Alert Queue</div>
        <div class="section-desc">${alerts.length} candidate leads ranked by composite risk score. Every alert ships with a glass-box explanation — no black-box scoring.</div>
      </div>
      <div class="flex gap-8 items-center">
        <input id="alert-search" type="text" placeholder="Search txid / IP / country…" style="background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 10px; font-size:12px; width:220px;">
        <select id="alert-severity" style="background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 10px; font-size:12px;">

          <option value="CRITICAL">Critical</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 380px; gap:14px; align-items:start;">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="dot" style="background:var(--red)"></span>ALERT QUEUE</div>
          <div class="card-note" id="alert-count-note"></div>
        </div>
        <div class="card-body" style="padding:8px 0 0;">
          <div style="display:grid; grid-template-columns:34px 56px 1fr 100px 90px 110px 120px 60px; gap:0; padding:0 16px 8px; font-size:10px; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em;">
            <div>#</div><div>Score</div><div>Transaction / Type</div><div>Country</div><div>Amount</div><div>Timestamp</div><div>ASN Org</div><div></div>
          </div>
          <div id="alert-rows" class="scroll-y" style="max-height:560px;"></div>
        </div>
      </div>

      <div class="card" style="position:sticky; top:72px;">
        <div class="card-head"><div class="card-title"><span class="dot" style="background:var(--amber)"></span>INTELLIGENCE CARD</div></div>
        <div class="card-body scroll-y" id="alert-detail" style="max-height:640px;">
          <div class="muted small" style="padding:24px 0; text-align:center;">Select an alert to view its explainable evidence card.</div>
        </div>
      </div>
    </div>
  `;

  function rowHtml(a){
    const isSel = window.__DOSSIER__.selected.has(a.txid);
    return `
    <div class="alert-row" data-txid="${a.txid}" style="display:grid; grid-template-columns:34px 56px 1fr 100px 90px 110px 120px 60px; gap:0; align-items:center; padding:8px 16px; border-top:1px solid var(--border-soft); cursor:pointer; transition:background .12s;">
      <div class="mono xsmall faint">${a.rank}</div>
      <div>
        <div style="width:38px; height:5px; background:var(--surface-3); border-radius:3px; overflow:hidden;">
          <div style="width:${a.score*100}%; height:100%; background:${a.score>0.6?'#FF5C5C':a.score>0.4?'#FF9A44':a.score>0.25?'#E8B84B':'#4C8DFF'};"></div>
        </div>
        <div class="xsmall faint mono" style="margin-top:2px;">${a.score.toFixed(3)}</div>
      </div>
      <div>
        <div class="mono xsmall truncate" style="color:var(--text);">${shortHash(a.txid,10,6)}</div>
        <div class="xsmall" style="color:${TYPE_COLOR_HEX[a.type]||'#8792A6'};">${a.type_label}</div>
      </div>
      <div class="xsmall">${a.src_country}</div>
      <div class="mono xsmall">${a.total_input.toFixed(3)}</div>
      <div class="xsmall faint">${a.timestamp.slice(5,16).replace('T',' ')}</div>
      <div class="xsmall truncate faint">${a.src_asn_org}</div>
      <div><span class="badge ${severityClass(a.severity)}">${a.severity[0]}</span></div>
    </div>`;
  }

  function renderRows(){
    const q = document.getElementById('alert-search').value.trim().toLowerCase();
    const sev = document.getElementById('alert-severity').value;
    const filtered = alerts.filter(a=>{
      if(sev && a.severity!==sev) return false;
      if(q && !(a.txid.toLowerCase().includes(q) || a.src_ip.includes(q) || a.src_country.toLowerCase().includes(q) || a.type_label.toLowerCase().includes(q))) return false;
      return true;
    });
    document.getElementById('alert-count-note').textContent = `${filtered.length} / ${alerts.length} SHOWN`;
    document.getElementById('alert-rows').innerHTML = filtered.map(rowHtml).join('');
    document.querySelectorAll('.alert-row').forEach(row=>{
      row.addEventListener('mouseenter', ()=> row.style.background='var(--surface-2)');
      row.addEventListener('mouseleave', ()=> row.style.background='');
      row.addEventListener('click', ()=> selectAlert(row.dataset.txid));
    });
  }

  function featureBar(f){
    const dirColor = f.direction==='above' ? '#FF9A44' : '#4C8DFF';
    return `
      <div style="margin-bottom:9px;">
        <div class="flex justify-between xsmall" style="margin-bottom:3px;">
          <span>${f.feature}</span>
          <span class="mono faint">z=${f.z>0?'+':''}${f.z}</span>
        </div>
        <div style="height:7px; background:var(--surface-3); border-radius:4px; overflow:hidden;">
          <div style="width:${f.contribution_pct}%; height:100%; background:${dirColor};"></div>
        </div>
        <div class="xsmall faint" style="margin-top:2px;">value ${f.value} · ${f.direction} median ${f.median} · ${f.contribution_pct}% of signal</div>
      </div>`;
  }

  function evidentiarySubgraphSvg(a){
    // schematic 2-hop reconstruction from the alert's own aggregate shape
    const W=330, H=180, cx=W/2;
    const ipX=40, txX=cx, outX=W-40;
    const nIn = Math.min(a.num_inputs, 5), nOut = Math.min(a.num_outputs,5);
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:${H}px;">`;
    // IP -> TX
    s += `<line x1="${ipX}" y1="${H/2}" x2="${txX}" y2="${H/2}" stroke="#26304199" stroke-width="1.2"/>`;
    s += `<circle cx="${ipX}" cy="${H/2}" r="9" fill="#3ECF7E"/>`;
    s += `<text x="${ipX}" y="${H/2+22}" text-anchor="middle" font-size="8.5" fill="#8792A6" font-family='Consolas'>${a.src_ip}</text>`;
    // inputs
    for(let i=0;i<nIn;i++){
      const y = H/2 - (nIn-1)*14 + i*28;
      s += `<line x1="${txX-70}" y1="${y}" x2="${txX}" y2="${H/2}" stroke="#FF5C5C55" stroke-width="1"/>`;
      s += `<circle cx="${txX-70}" cy="${y}" r="4.5" fill="${i===0?'#4C8DFF':'#4C8DFF99'}"/>`;
    }
    if(a.num_inputs>5) s += `<text x="${txX-70}" y="${H/2 + (nIn)*14 + 10}" text-anchor="middle" font-size="8" fill="#545E71">+${a.num_inputs-5} more</text>`;
    // tx node
    s += `<rect x="${txX-11}" y="${H/2-11}" width="22" height="22" rx="4" fill="#FF5C5C" transform="rotate(45 ${txX} ${H/2})"/>`;
    s += `<text x="${txX}" y="${H/2+34}" text-anchor="middle" font-size="8.5" fill="#DCE3EE" font-family='Consolas'>${shortHash(a.txid,6,4)}</text>`;
    // outputs
    for(let i=0;i<nOut;i++){
      const y = H/2 - (nOut-1)*14 + i*28;
      const isPeel = a.type==='peel_chain' && i===0;
      s += `<line x1="${txX}" y1="${H/2}" x2="${txX+70}" y2="${y}" stroke="${isPeel?'#FF9A4499':'#4C8DFF55'}" stroke-width="1"/>`;
      s += `<circle cx="${txX+70}" cy="${y}" r="4.5" fill="${isPeel?'#FF9A44':'#4C8DFF99'}"/>`;
    }
    if(a.num_outputs>5) s += `<text x="${txX+70}" y="${H/2 + (nOut)*14 + 10}" text-anchor="middle" font-size="8" fill="#545E71">+${a.num_outputs-5} more</text>`;
    s += `<circle cx="${outX}" cy="${H/2}" r="9" fill="#3ECF7E" opacity="0.5"/>`;
    s += `<text x="${outX}" y="${H/2+22}" text-anchor="middle" font-size="8.5" fill="#8792A6" font-family='Consolas'>${a.dst_ip.length>13?a.dst_ip.slice(0,13):a.dst_ip}</text>`;
    // flow animation dot
    s += `<circle r="2.6" fill="#fff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M${ipX},${H/2} L${outX},${H/2}"/></circle>`;
    s += `</svg>`;
    return s;
  }

  function compositeBreakdown(a){
    // illustrative decomposition of composite score into taint / anomaly / motif / ASN buckets
    const asnRisk = a.src_asn_org==='Unknown' ? 0.8 : (/hosting|cloud|amazon|google|cloudflare/i.test(a.src_asn_org)?0.5:0.2);
    const motifW = a.type==='none'? 0.15: 0.85;
    const zSum = a.features.reduce((s,f)=>s+Math.abs(f.z),0);
    const anomW = Math.min(1, zSum/40);
    const taintW = a.type==='peel_chain' ? 0.7 : a.type==='shared_ip_burst'? 0.5: 0.3;
    const parts = [
      {label:'Taint Propagation (PPR)', v:taintW, color:'#FF5C5C'},
      {label:'Statistical Anomaly (IsoForest)', v:anomW, color:'#E8B84B'},
      {label:'Laundering Motif Match', v:motifW, color:'#C77DFF'},
      {label:'ASN / Network Risk', v:asnRisk, color:'#3ECF7E'},
    ];
    const total = parts.reduce((s,p)=>s+p.v,0)||1;
    return parts.map(p=>({...p, pct: Math.round(p.v/total*100)}));
  }

  function selectAlert(txid){
    const a = alerts.find(x=>x.txid===txid);
    document.querySelectorAll('.alert-row').forEach(r=> r.style.outline = r.dataset.txid===txid ? '1px solid var(--sig-teal)' : '');
    const breakdown = compositeBreakdown(a);
    const inDossier = window.__DOSSIER__.selected.has(a.txid);
    document.getElementById('alert-detail').innerHTML = `
      <div class="flex justify-between items-start" style="margin-bottom:8px;">
        <div>
          <div class="mono xsmall faint">RANK #${a.rank}</div>
          <div class="mono" style="font-size:13px; color:var(--text); word-break:break-all; margin-top:2px;">${shortHash(a.txid,14,8)}</div>
        </div>
        <span class="badge ${severityClass(a.severity)}">${a.severity}</span>
      </div>
      <div class="badge b-low" style="margin-bottom:8px; background:${TYPE_COLOR_HEX[a.type]}22; color:${TYPE_COLOR_HEX[a.type]};">${a.type_label}</div>
      <div class="small muted" style="margin-bottom:12px;">${a.type_desc}</div>

      <div class="xsmall faint" style="margin-bottom:6px;">EVIDENTIARY SUBGRAPH — 2-HOP RECONSTRUCTION</div>
      <div style="background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; margin-bottom:14px;">${evidentiarySubgraphSvg(a)}</div>

      <div class="xsmall faint" style="margin-bottom:8px;">TREESHAP FEATURE ATTRIBUTION</div>
      ${a.features.map(featureBar).join('')}

      <div class="hr"></div>
      <div class="xsmall faint" style="margin-bottom:8px;">COMPOSITE RISK BREAKDOWN</div>
      <div style="display:flex; height:10px; border-radius:5px; overflow:hidden; margin-bottom:8px;">
        ${breakdown.map(p=>`<div style="width:${p.pct}%; background:${p.color};" title="${p.label}"></div>`).join('')}
      </div>
      <div class="flex-col gap-4" style="margin-bottom:14px;">
        ${breakdown.map(p=>`<div class="flex justify-between xsmall"><span class="flex items-center gap-6"><span style="width:7px;height:7px;border-radius:50%;background:${p.color};display:inline-block;"></span>${p.label}</span><span class="mono">${p.pct}%</span></div>`).join('')}
      </div>

      <div class="hr"></div>
      <div class="flex-col gap-4" style="margin-bottom:14px;">
        <div class="small flex justify-between"><span class="muted">Source IP</span><span class="mono">${a.src_ip}</span></div>
        <div class="small flex justify-between"><span class="muted">Destination IP</span><span class="mono">${a.dst_ip}</span></div>
        <div class="small flex justify-between"><span class="muted">Country / ASN Org</span><span class="mono truncate" style="max-width:160px;">${a.src_country} · ${a.src_asn_org}</span></div>
        <div class="small flex justify-between"><span class="muted">IP↔Wallet Diversity</span><span class="mono">${a.ip_wallet_diversity}</span></div>
        <div class="small flex justify-between"><span class="muted">Inputs / Outputs</span><span class="mono">${a.num_inputs} / ${a.num_outputs}</span></div>
        <div class="small flex justify-between"><span class="muted">Total In / Out</span><span class="mono">${a.total_input} / ${a.total_output} BTC</span></div>
        <div class="small flex justify-between"><span class="muted">Fee</span><span class="mono">${a.fee}</span></div>
        <div class="small flex justify-between"><span class="muted">Timestamp</span><span class="mono">${a.timestamp}</span></div>
      </div>

      <button class="btn ${inDossier?'primary':''}" id="btn-add-dossier" style="width:100%; justify-content:center;">
        ${inDossier ? '✓ Added to Dossier' : '+ Add to Intelligence Dossier'}
      </button>
    `;
    document.getElementById('btn-add-dossier').addEventListener('click', ()=>{
      if(window.__DOSSIER__.selected.has(a.txid)) window.__DOSSIER__.selected.delete(a.txid);
      else window.__DOSSIER__.selected.set(a.txid, a);
      selectAlert(txid);
      window.dispatchEvent(new CustomEvent('bypeel:dossierchange'));
    });
  }

  document.getElementById('alert-search').addEventListener('input', renderRows);
  document.getElementById('alert-severity').addEventListener('change', renderRows);
  renderRows();
  // auto-select top alert
  if(alerts.length) setTimeout(()=> selectAlert(alerts[0].txid), 200);
}

renderAlertsModule(window.BYPEEL_DATA);
</script>

      </button>

  }

  function refresh(){
    const items = [...window.__DOSSIER__.selected.values()];
    document.getElementById('dossier-count').textContent = items.length;
    if(items.length===0){
      document.getElementById('dossier-list').innerHTML = `<div class="muted small" style="padding:24px 0; text-align:center;">No alerts selected yet. Go to the <b>Alerts</b> tab and click &ldquo;Add to Intelligence Dossier&rdquo; on any lead.</div>`;
    } else {
      document.getElementById('dossier-list').innerHTML = items.map(itemRow).join('');

  window.addEventListener('bypeel:dossierchange', refresh);
  window.addEventListener('bypeel:tabshown', (e)=>{ if(e.detail==='dossier') refresh(); });
  refresh();

  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }

    const items = [...window.__DOSSIER__.selected.values()];

      notes: document.getElementById('dossier-notes').value || '',
      report_hash_sha256: window.__DOSSIER__.reportHash || null,
      artifacts: items.map(a=>({...a, seal_sha256: (window.__DOSSIER__.seals||[]).find(s=>s.txid===a.txid)?.hash || null})),
    };
    // Persist to the local SQLite DB (fire-and-forget; falls back silently if backend isn't running)
    fetch('/api/dossiers', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
      .catch(()=>{ /* backend not running — export still works via the download below */ });

    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `${linkedCaseId}-evidence.json`;
    document.body.appendChild(link); link.click(); link.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-print').addEventListener('click', ()=>{
    const items = [...window.__DOSSIER__.selected.values()];
    const inv = document.getElementById('dossier-investigator').value || 'Unattributed';
    const notes = document.getElementById('dossier-notes').value || '(none provided)';
    const seals = window.__DOSSIER__.seals || [];
    document.getElementById('printable-report').innerHTML = `
      <div class="pr-header">

      <table class="pr-meta">
        <tr><td>Case ID</td><td>${caseId}</td><td>Generated</td><td>${new Date().toLocaleString()}</td></tr>
        <tr><td>Investigator</td><td>${inv}</td><td>Artifacts</td><td>${items.length}</td></tr>

      <div class="pr-section-title">Evidence Items</div>
      ${items.map((a,i)=>`
        <div class="pr-item">
          <div class="pr-item-head">#${i+1} · ${a.type_label} · Severity ${a.severity} · Score ${a.score.toFixed(3)}</div>
          <table class="pr-table">
            <tr><td>TXID</td><td colspan="3" style="word-break:break-all;">${a.txid}</td></tr>
            <tr><td>Timestamp</td><td>${a.timestamp}</td><td>Country / ASN</td><td>${a.src_country} / ${a.src_asn_org}</td></tr>
            <tr><td>Src IP</td><td>${a.src_ip}</td><td>Dst IP</td><td>${a.dst_ip}</td></tr>
            <tr><td>Total In</td><td>${a.total_input} BTC</td><td>Total Out</td><td>${a.total_output} BTC</td></tr>
            <tr><td>Inputs/Outputs</td><td>${a.num_inputs} / ${a.num_outputs}</td><td>Fee</td><td>${a.fee}</td></tr>
          </table>
          <div class="pr-desc">${a.type_desc}</div>
          <div class="pr-feat">${a.features.map(f=>`<span>${f.feature}: ${f.value} (z=${f.z})</span>`).join(' &nbsp;·&nbsp; ')}</div>
          ${seals.find(s=>s.txid===a.txid) ? `<div class="pr-hash">SHA-256: ${seals.find(s=>s.txid===a.txid).hash}</div>` : ''}
        </div>
      `).join('')}
      ${window.__DOSSIER__.reportHash ? `<div class="pr-section-title">Report Verification Seal</div><div class="pr-hash">${window.__DOSSIER__.reportHash}</div>` : '<div class="pr-section-title">Report Verification Seal</div><div class="pr-desc">Not yet computed — click "Compute Verification Seals" before export for a signed report.</div>'}
      <div class="pr-footer">Generated offline by bypeel · This document is a synthetic-data demonstration artifact prepared for evaluation purposes.</div>
    `;
    window.print();
  });

})();
